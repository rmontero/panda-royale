<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --night: #211a35;
    --night-deep: #171224;
    --panel: #2a2242;
    --panel-2: #322a4d;
    --panel-line: rgba(246,197,103,0.14);
    --paper: #f6f1e4;
    --lantern: #e8a13a;
    --lantern-bright: #f6c567;
    --ink: #f6f1e4;
    --ink-dim: #b7aed0;
    --muted: #8a80ab;
    --good: #7cc98a;
    --bad: #e07a72;
    --radius: 16px;

    --c-yellow: #f2c94c;
    --c-purple: #a37bff;
    --c-blue: #57a9e8;
    --c-blue-glitter: #d9b8ff;
    --c-red: #e6675f;
    --c-green: #59b980;
    --c-clear: #e9e6da;
    --c-pink: #f28fc7;
  }

  /* light theme — warm paper, dark ink; lantern accent preserved */
  html[data-theme="light"]{
    --night: #ffffff;
    --night-deep: #f6f1e4;
    --panel: #ffffff;
    --panel-2: #f1ead9;
    --panel-line: rgba(120,90,20,0.18);
    --paper: #ffffff;
    --lantern: #d98a1f;
    --lantern-bright: #b9720f;
    --ink: #2a2118;
    --ink-dim: #6b5f4a;
    --muted: #96896f;
    --good: #3f9d55;
    --bad: #c9483f;
  }
  html[data-theme="light"] body{
    background:
      radial-gradient(ellipse at 20% -10%, rgba(217,138,31,0.10), transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(163,123,255,0.06), transparent 45%),
      var(--night-deep);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(246,197,103,0.13), transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(163,123,255,0.10), transparent 45%),
      var(--night-deep);
    color:var(--ink);
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100svh;
    padding-bottom:env(safe-area-inset-bottom);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #app[data-tabs="n"]{ padding-bottom:0; }
  .screen{ flex:1 1 auto; }
  h1,h2,h3,.display{ font-family:'Baloo 2', system-ui, sans-serif; font-weight:700; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }

  .screen{ padding:20px 18px 12px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--panel-line);
    padding-right:70px; /* clear the fixed top-right menu FAB */
  }
  .topbar .code{ font-family:'Baloo 2', monospace; letter-spacing:0.12em; font-size:1.05rem; color:var(--lantern-bright); }
  .topbar .sub{ font-size:0.8rem; color:var(--ink-dim); }
  .link-btn{ background:none; border:none; color:var(--ink-dim); font-size:0.85rem; padding:6px 4px; cursor:pointer; }

  .hero{ text-align:left; padding-top:12px; margin-bottom:6px; }
  .hero h1{ font-size:2rem; line-height:1.1; }
  .hero .sub{ color:var(--ink-dim); margin-top:8px; font-size:0.95rem; line-height:1.5; }
  .lanterns{ display:flex; gap:8px; margin-bottom:16px; }
  .lanterns span{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  label.field-label{ display:block; font-size:0.8rem; color:var(--ink-dim); margin-bottom:6px; margin-top:16px; }
  input.text-input{
    display:block; width:100%; padding:13px 14px; border-radius:12px;
    border:1px solid var(--panel-line); background:var(--panel);
    color:var(--ink); font-size:1rem;
  }
  input.text-input:focus{ outline:2px solid var(--lantern); outline-offset:1px; }
  input.code-input{ text-transform:uppercase; letter-spacing:0.18em; font-family:'Baloo 2',monospace; font-size:1.2rem; text-align:center; }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:15px 16px; border-radius:12px; border:none;
    font-size:1rem; font-weight:600; cursor:pointer; margin-top:12px;
  }
  .btn-primary{ background:var(--lantern); color:#241a06; }
  .btn-primary:active{ background:var(--lantern-bright); }
  .btn-secondary{ background:var(--panel); color:var(--ink); border:1px solid var(--panel-line); }
  .btn-ghost{ background:none; color:var(--lantern-bright); border:1px dashed var(--panel-line); }
  .btn:disabled{ opacity:0.5; }

  .seg{
    display:flex; background:var(--panel); border:1px solid var(--panel-line);
    border-radius:12px; padding:4px; margin-top:6px;
  }
  .seg button{
    flex:1; padding:11px 8px; border:none; background:none; cursor:pointer;
    color:var(--ink-dim); font-size:0.9rem; font-weight:600; border-radius:9px;
  }
  .seg button.on{ background:var(--lantern); color:#241a06; }

  /* home mode cards (Online / Pass and Play) with helper text */
  .mode-cards{ display:flex; flex-direction:column; gap:12px; margin-top:20px; }
  .mode-card{
    display:block; width:100%; text-align:left; padding:16px 18px; border-radius:var(--radius);
    background:var(--panel); border:1px solid var(--panel-line); cursor:pointer; color:var(--ink);
  }
  .mode-card:first-child{ background:var(--lantern); color:#241a06; border-color:transparent; }
  .mode-card .mc-title{ font-family:'Baloo 2'; font-size:1.2rem; font-weight:700; }
  .mode-card .mc-help{ font-size:0.85rem; margin-top:4px; line-height:1.45; opacity:0.85; }
  .mode-card:first-child .pro-badge{ background:#241a06; color:var(--lantern); }
  .home-greet{ margin-top:16px; }
  .link-btn.inline{ display:inline; padding:0 2px; color:var(--lantern-bright); text-decoration:underline; }

  /* pass-and-play hand-off prompt */
  .passto{ margin-top:14px; }
  .passto-lab{ font-size:0.72rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:6px; }
  .passto-btn{ margin-top:0; }
  .passto-avatar{
    width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.8rem; color:#241a06; margin-right:2px;
  }

  .divider{ display:flex; align-items:center; gap:10px; margin:22px 0 6px; color:var(--muted); font-size:0.8rem; }
  .divider::before,.divider::after{ content:''; flex:1; height:1px; background:var(--panel-line); }

  .card{ background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius); padding:16px; margin-top:14px; }

  .code-display{
    text-align:center; padding:20px 16px; border-radius:var(--radius);
    background:linear-gradient(180deg, rgba(246,197,103,0.14), rgba(246,197,103,0.03));
    border:1px solid var(--panel-line); margin-top:14px;
  }
  .code-display .label{ color:var(--ink-dim); font-size:0.82rem; }
  .code-display .code-big{ font-family:'Baloo 2', monospace; font-size:2.4rem; letter-spacing:0.16em; color:var(--lantern-bright); margin-top:2px; }

  .section-title{ font-size:0.78rem; color:var(--ink-dim); margin:22px 0 8px; text-transform:uppercase; letter-spacing:0.06em; }

  .player-row{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--panel-line); position:relative; }
  .player-row:last-child{ border-bottom:none; }
  .player-row.dragging{ z-index:5; background:var(--panel-2); box-shadow:0 8px 20px rgba(0,0,0,0.4); border-radius:10px; opacity:0.95; }
  .drag-handle{ cursor:grab; color:var(--muted); font-size:1rem; padding:4px 2px; touch-action:none; flex-shrink:0; }
  .avatar{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:0.85rem; color:#241a06; flex-shrink:0;
  }
  .avatar[data-a="cycle-color"]{ cursor:pointer; }
  .player-row .name{ font-size:0.95rem; flex:1; }
  .player-row .rank-tag{ margin-left:2px; }
  .player-row .you-tag{ font-size:0.72rem; color:var(--lantern-bright); margin-left:4px; }
  .player-row .status{ font-size:0.8rem; color:var(--ink-dim); }
  .player-row .status.done{ color:var(--good); }
  .icon-btn{ background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer; padding:4px 6px; }
  .pill-btn{
    background:var(--panel-2); border:1px solid var(--panel-line); color:var(--ink);
    font-size:0.82rem; font-weight:600; padding:7px 12px; border-radius:20px; cursor:pointer;
  }
  .pill-btn.done{ color:var(--good); }

  .round-picker{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .round-picker button{
    width:44px; height:44px; border-radius:11px; border:1px solid var(--panel-line);
    background:var(--panel); color:var(--ink); font-size:1.2rem; cursor:pointer;
  }
  .round-picker .round-label{ flex:1; text-align:center; font-family:'Baloo 2'; font-size:1.1rem; }

  .add-row{ display:flex; gap:8px; margin-top:10px; }
  .add-row input{ flex:1; }
  .add-row button{ margin-top:0; width:auto; padding:13px 18px; }

  .photo-section{ margin-top:26px; padding-top:18px; border-top:1px solid var(--panel-line); }
  .photo-section .section-title{ margin-top:0; }
  .capture-zone{
    margin-top:10px; border:1.5px dashed var(--panel-line); border-radius:var(--radius);
    padding:20px 16px; cursor:pointer; background:var(--panel);
    display:flex; align-items:center; gap:12px; text-align:left;
  }
  .capture-zone .icon{ font-size:1.6rem; flex-shrink:0; }
  .capture-zone .cta{ font-weight:600; font-size:0.95rem; }
  .capture-zone .hint{ color:var(--ink-dim); font-size:0.8rem; margin-top:3px; line-height:1.45; }

  .thumb-row{ display:flex; align-items:center; gap:12px; margin-top:12px; }
  .thumb-row img{ width:56px; height:56px; object-fit:cover; border-radius:10px; border:1px solid var(--panel-line); }
  .thumb-row .status{ font-size:0.9rem; color:var(--ink-dim); }

  .spinner{
    width:16px; height:16px; border-radius:50%;
    border:2px solid var(--panel-line); border-top-color:var(--lantern);
    display:inline-block; animation:spin 0.8s linear infinite; vertical-align:-3px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .entry-grid{ margin-top:14px; border:1px solid var(--panel-line); border-radius:var(--radius); overflow:hidden; }
  .entry-r{
    display:flex; align-items:center; gap:10px; padding:11px 12px;
    border-bottom:1px solid var(--panel-line); background:var(--panel);
  }
  .entry-r:last-child{ border-bottom:none; }
  .entry-r .dot{ width:15px; height:15px; border-radius:5px; flex-shrink:0; border:1px solid rgba(0,0,0,0.25); }
  .entry-r .lab{ width:64px; flex-shrink:0; font-size:0.9rem; font-weight:600; }
  .entry-r .lab small{ display:block; color:var(--muted); font-weight:500; font-size:0.7rem; }
  .entry-r .ins{ display:flex; gap:6px; flex:1; }
  .entry-r input{
    width:100%; min-width:0; padding:9px 8px; border-radius:9px; text-align:center;
    border:1px solid var(--panel-line); background:var(--night); color:var(--ink);
    font-size:1rem; font-family:'Baloo 2', monospace; letter-spacing:0.04em;
  }
  .entry-r input:focus{ outline:2px solid var(--lantern); outline-offset:1px; }
  .entry-r input.accent::placeholder{ color:var(--lantern-bright); opacity:0.8; }
  .entry-hint{ font-size:0.76rem; color:var(--muted); margin-top:8px; line-height:1.5; }

  .total-banner{
    margin-top:16px; padding:16px; border-radius:var(--radius);
    background:linear-gradient(180deg, rgba(246,197,103,0.16), rgba(246,197,103,0.03));
    border:1px solid var(--panel-line); text-align:center;
  }
  .total-banner .n{ font-family:'Baloo 2'; font-size:2.4rem; color:var(--lantern-bright); line-height:1; }
  .total-banner .l{ color:var(--ink-dim); font-size:0.8rem; margin-top:4px; }
  .breakdown{ margin-top:10px; font-size:0.84rem; color:var(--ink-dim); }
  .breakdown .row{ display:flex; justify-content:space-between; padding:2px 0; }

  /* PDF-style horizontal score strip: one column per color (dash when empty)
     then the Row Total at the end, matching the printed score sheet. */
  .score-strip{
    display:flex; gap:4px; margin-top:14px; overflow-x:auto;
    -webkit-overflow-scrolling:touch; padding-bottom:2px;
  }
  .score-strip .ss-col{
    flex:1 1 0; min-width:38px; display:flex; flex-direction:column; align-items:center;
    gap:4px; padding:7px 3px; border-radius:9px; background:rgba(0,0,0,0.16);
    border:1px solid var(--panel-line);
  }
  .score-strip .ss-col.empty{ opacity:0.5; }
  .score-strip .ss-dot{ width:11px; height:11px; border-radius:4px; border:1px solid rgba(0,0,0,0.3); }
  .score-strip .ss-lab{ font-size:0.58rem; color:var(--ink-dim); text-align:center; line-height:1.1; letter-spacing:0.01em; }
  .score-strip .ss-val{ font-family:'Baloo 2', monospace; font-size:1rem; color:var(--ink); }
  .score-strip .ss-total{ background:rgba(246,197,103,0.16); border-color:rgba(246,197,103,0.4); }
  .score-strip .ss-total .ss-lab{ color:var(--lantern-bright); font-weight:700; }
  .score-strip .ss-total .ss-val{ color:var(--lantern-bright); font-weight:700; }
  /* empty-column dashes centered in their cell */
  .score-strip .ss-col.empty .ss-val{ color:var(--muted); text-align:center; }
  .sheet-table td{ text-align:center; vertical-align:middle; }

  /* ---- entry accordion (one color open at a time) ---- */
  /* ---- entry dice row: 7 colored dice in a single row, name below ---- */
  .dice-row{ display:flex; gap:6px; margin-top:14px; }
  .dcell{
    flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:none; border:none; cursor:pointer; padding:4px 0; border-radius:10px;
  }
  .dcell.open{ background:var(--panel-2); }
  .dcell .dface{
    width:100%; max-width:44px; aspect-ratio:1/1; border-radius:11px; border:1px solid rgba(0,0,0,0.25);
    display:flex; align-items:center; justify-content:center; color:#241a06;
    font-family:'Baloo 2', monospace; font-weight:700; font-size:1.05rem; box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .dcell.open .dface{ outline:2px solid var(--lantern-bright); outline-offset:2px; }
  .dcell .dname{ font-size:0.66rem; color:var(--ink-dim); text-align:center; line-height:1.05; }

  /* expanded panel below the dice row for the selected color */
  .dexpand{
    margin-top:10px; padding:14px; border-radius:var(--radius);
    background:var(--panel-2); border:1px solid var(--panel-line);
  }
  .dexpand-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .dexpand-head .dot{ width:16px; height:16px; border-radius:5px; border:1px solid rgba(0,0,0,0.25); }
  .dexpand-head .acc-lab{ font-size:1rem; font-weight:700; }
  .acc-ins{ display:flex; gap:10px; }
  .acc-field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .acc-flab{ font-size:0.7rem; color:var(--ink-dim); }
  .acc-ins input{
    width:100%; min-width:0; padding:12px 12px; border-radius:10px; text-align:center;
    border:1px solid var(--panel-line); background:var(--night); color:var(--ink);
    font-size:1.1rem; font-family:'Baloo 2', monospace; letter-spacing:0.05em;
  }
  .acc-ins input:focus{ outline:2px solid var(--lantern); outline-offset:1px; }
  .acc-ins input.accent::placeholder{ color:var(--lantern-bright); opacity:0.8; }
  .acc-math{
    margin-top:10px; text-align:center; font-family:'Baloo 2', monospace;
    font-size:1.05rem; color:var(--lantern-bright);
  }
  .acc-math .er-empty{ color:var(--muted); font-size:0.85rem; font-style:italic; font-family:inherit; }
  .dcalc{ margin-top:8px; font-size:0.76rem; color:var(--muted); line-height:1.5; text-align:center; }
  @media (max-width: 360px){ .dcell .dname{ font-size:0.58rem; } }

  /* ---- current-round score row (tap to expand full sheet) ---- */
  .round-row{
    display:block; width:100%; text-align:left; margin-top:16px; padding:14px 16px;
    border-radius:var(--radius); border:1px solid var(--panel-line); cursor:pointer;
    background:linear-gradient(180deg, rgba(246,197,103,0.16), rgba(246,197,103,0.03)); color:var(--ink);
  }
  .round-row .rr-top{ display:flex; align-items:baseline; gap:10px; }
  .round-row .rr-total{ font-family:'Baloo 2'; font-size:2rem; color:var(--lantern-bright); line-height:1; }
  .round-row .rr-label{ color:var(--ink-dim); font-size:0.82rem; flex:1; }
  .round-row .rr-caret{ color:var(--lantern-bright); font-size:0.78rem; font-weight:600; }
  .round-row .score-strip{ margin-top:12px; }

  /* ---- bottom-sheet full PDF-style scorecard ---- */
  .sheet-backdrop{
    position:fixed; inset:0; z-index:70; background:rgba(15,11,26,0.5);
    -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); animation:flyfade 0.18s ease-out;
  }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:71; max-width:600px; margin:0 auto;
    background:var(--panel); border-top-left-radius:20px; border-top-right-radius:20px;

  /* ============================================================ *
   * responsive — mobile first, then tablet (fluid, both orientations),
   * then desktop (fixed, consistent per-screen widths)
   * ============================================================ */

  /* short-landscape safety net, any width: a ~375-430px-tall viewport
     (a phone turned sideways) needs tighter hero padding so content
     doesn't push into a scroll. */
  @media (orientation: landscape) and (max-height: 500px){
    #app{ padding-bottom: 0; }
    .hero{ padding-top: 4px; }
    .hero h1{ font-size: 1.7rem; }
  }

  /* roomy layout: tablets in portrait or landscape, and phones turned
     landscape (often wider than 680px, or wide-but-short below it) —
     fluid width (min(vw, cap)) so the container uses whatever extra
     space the device has. ONE shell width for every screen — not a
     different max-width per screen — so switching tabs doesn't visibly
     resize the app; screens that are just a form or a page of text
     (home/lobby/credits) get a centered reading column inside that
     shell instead, rather than a narrower outer shell of their own. */
  @media (min-width: 680px),
         (min-width: 560px) and (max-height: 500px) and (orientation: landscape){
    body{ background-attachment: fixed; }
    #app{
      max-width: min(95vw, 900px);
      padding-bottom: 0;
      border-inline: 1px solid var(--panel-line);
      box-shadow: 0 0 90px rgba(0,0,0,0.4);
      background: rgba(23,18,36,0.30);
    }
    .screen{ padding: 26px 32px 22px; }
    .topbar{ padding: 16px 32px; }

    /* tab bar joins the app pane instead of floating over the viewport */
    .toast{ bottom: 88px; }

    .hero h1{ font-size: 2.2rem; }
    .btn{ padding: 14px 16px; }

    /* home/lobby/credits are just a form or a page of text — a
       comfortable centered column, not stretched edge to edge of the
       wider shell (which stays the same width as every other screen) */
    #app[data-screen="home"] .screen > *,
    #app[data-screen="lobby"] .screen > *,
    #app[data-screen="credits"] .screen > *{
      max-width: 520px; margin-left: auto; margin-right: auto;
    }

    /* dice entry: two columns as soon as there's room, so all 7 colors
       don't have to be scrolled through one at a time */
    #app[data-screen="entry"] .entry-grid{
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      border: 0; overflow: visible; background: transparent;
    }
    #app[data-screen="entry"] .entry-grid .entry-r{
      border: 1px solid var(--panel-line); border-radius: 12px;
    }
    #app[data-screen="entry"] .entry-grid .entry-r:only-child{ grid-column: 1 / -1; }
    /* left-aligned (not centered) to the same edge as the grid and the
       heading above — centering them independently left a jagged edge
       where the narrower total/save/back block didn't line up with the
       full-width grid and title */
    #app[data-screen="entry"] .total-banner,
    #app[data-screen="entry"] .entry-hint,
    #app[data-screen="entry"] .photo-section,
    #app[data-screen="entry"] .screen > .btn{
      max-width: 560px; margin-left: 0; margin-right: auto;
    }

    /* scoreboard: no horizontal scroll, roomier cells, full names */
    #app[data-screen="board"] table.board{ font-size: 0.92rem; }
    #app[data-screen="board"] table.board th,
    #app[data-screen="board"] table.board td{ padding: 12px 9px; }
    #app[data-screen="board"] table.board td.name-cell,
    #app[data-screen="board"] table.board th.name-cell{ max-width: none; }
  }

  /* desktop: the shell stops scaling with the viewport — one fixed
     width shared by every screen, same rationale as the tablet block */
  @media (min-width: 1040px){
    .screen{ padding: 34px 40px 26px; }
    .topbar{ padding: 18px 40px; }
    #app{ max-width: 960px; }

    .hero h1{ font-size: 2.4rem; }
  }

function detectLang(){
  try {
    const saved = localStorage.getItem('pr.lang');
    if(saved && I18N[saved]) return saved;
  } catch {}
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for(const p of prefs){
    const base = String(p || '').toLowerCase().split('-')[0];
    if(I18N[base]) return base;
  }
  return 'en';
}
function t(key, vars){
  const dict = I18N[state.lang] || I18N.en;
  let s = (dict[key] != null ? dict[key] : (I18N.en[key] != null ? I18N.en[key] : key));
  if(vars) for(const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
  return s;
}
function setLang(l){
  if(!I18N[l]) return;
  try { localStorage.setItem('pr.lang', l); } catch {}
  document.documentElement.lang = l;
  applyMeta(l);
  setState({ lang: l });
  savePrefsRemote({ lang: l });
}

}
// Translate the document <title> and description for human visitors. The static
// tags in the HTML stay English so non-JS crawlers and link scrapers see them.
function applyMeta(l){
  const dict = I18N[l] || I18N.en;
  if(dict['meta.title']) document.title = dict['meta.title'];
  const d = document.querySelector('meta[name="description"]');
  if(d && dict['meta.desc']) d.setAttribute('content', dict['meta.desc']);
}

const COLOR_HEX = {
  yellow:'var(--c-yellow)', purple:'var(--c-purple)', blue:'var(--c-blue)',
  red:'var(--c-red)', green:'var(--c-green)', clear:'var(--c-clear)', pink:'var(--c-pink)',

const ENTRY_ROWS = [
  { color:'yellow', fields:[{ key:'yellow', phKey:'ph.eg356' }] },
  { color:'purple', noteKey:'note.x2', fields:[{ key:'purple', phKey:'ph.values' }] },
  { color:'blue', fields:[
      { key:'blue', phKey:'ph.plain' }, { key:'blueGlitter', phKey:'ph.glitter', accent:true } ] },
  { color:'red', noteKey:'note.xcount', fields:[
      { key:'redWhite', phKey:'ph.whitePlus' }, { key:'redBlack', phKey:'ph.blackMinus', accent:true } ] },
  { color:'green', fields:[{ key:'green', phKey:'ph.values' }] },
  { color:'clear', fields:[{ key:'clear', phKey:'ph.values' }] },
  { color:'pink', fields:[{ key:'pink', phKey:'ph.pityDie' }] },
];
const FIELD_KEYS = ['yellow','purple','blue','blueGlitter','redWhite','redBlack','green','clear','pink'];
const emptyFields = () => Object.fromEntries(FIELD_KEYS.map(k => [k, '']));

const AVATAR_COLORS = ['var(--c-yellow)','var(--c-purple)','var(--c-blue)','var(--c-red)','var(--c-green)','var(--c-pink)','var(--c-clear)'];
function avatarColorIndex(id){ let h=0; for(const ch of String(id)) h += ch.charCodeAt(0); return h % AVATAR_COLORS.length; }
function avatarColor(id){ return AVATAR_COLORS[avatarColorIndex(id)]; }
// Local-mode players can tap their avatar to pick a clan color explicitly
// (p.colorIndex); everyone else (online players, or before a tap) falls
// back to the deterministic hash so avatars are still consistent by default.
function playerColor(p){ return AVATAR_COLORS[(p.colorIndex ?? avatarColorIndex(p.id)) % AVATAR_COLORS.length]; }
function genId(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3); }
// Pity (pink) dice available for the box, by player count — 2-3:1, 4-6:2, 7-9:3, 10+:4.
function pinkDiceFor(n){
  if(n <= 1) return 0;
  if(n <= 3) return 1;
  if(n <= 6) return 2;
  if(n <= 9) return 3;
  return 4;
}

/* ------------------------------------------------------------------ *
 * fields <-> dice
 * ------------------------------------------------------------------ */
function parseValues(s){
  return String(s || '').split(/[^0-9.]+/).map(x => x.trim()).filter(Boolean)
    .map(Number).filter(n => Number.isFinite(n)).map(n => Math.max(0, Math.min(99, Math.round(n))));
}
function fieldsToDice(f){
  const dice = [];
  parseValues(f.yellow).forEach(v => dice.push({ color:'yellow', value:v }));
  parseValues(f.purple).forEach(v => dice.push({ color:'purple', value:v }));
  parseValues(f.blue).forEach(v => dice.push({ color:'blue', value:v, glitter:false }));
  parseValues(f.blueGlitter).forEach(v => dice.push({ color:'blue', value:v, glitter:true }));
  parseValues(f.redWhite).forEach(v => dice.push({ color:'red', value:v, sign:'positive' }));
  parseValues(f.redBlack).forEach(v => dice.push({ color:'red', value:v, sign:'negative' }));
  parseValues(f.green).forEach(v => dice.push({ color:'green', value:v }));
  parseValues(f.clear).forEach(v => dice.push({ color:'clear', value:v }));
  parseValues(f.pink).forEach(v => dice.push({ color:'pink', value:v }));
  return dice;
}
function diceToFields(dice){
  const f = emptyFields();
  const add = (k, v) => { f[k] = (f[k] ? f[k] + ' ' : '') + v; };
  (dice || []).forEach(d => {
    if(!DICE_COLORS.includes(d.color)) return;
    if(d.color === 'blue') add(d.glitter ? 'blueGlitter' : 'blue', d.value);
    else if(d.color === 'red') add(d.sign === 'negative' ? 'redBlack' : 'redWhite', d.value);
    else add(d.color, d.value);
  });
  return f;
}
// Round 1: every player rolls only their single starting yellow die.
function diceForRound(fields, round){
  const dice = fieldsToDice(fields);
  if(round === 1){
    const y = dice.find(d => d.color === 'yellow');
    return y ? [{ color:'yellow', value:y.value }] : [];
  }
  return dice;
}

function resizeImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1100;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function totalsFor(v){
  return v.players.map(p => {
    let total = 0;
    for(let r = 1; r <= ROUNDS; r++){
      const e = v.scores[r] && v.scores[r][p.id];
      if(e) total += e.total;
    }
    return { ...p, total };
  }).sort((a, b) => b.total - a.total);
}

async function createOnline(name){

  // If we arrived via an invite link/QR, the "Online" action JOINS that game
  // rather than creating a new one.
  if(state.pendingJoinCode){
    const code = state.pendingJoinCode;
    state.pendingJoinCode = null;
    return joinOnline(state.me.name, code);
  }
  try {
    const game = await api('create', { playerId: state.me.id, name: state.me.name });
    LS.set('pr.session', { mode:'online', code: game.code });
    LS.set(roundKey(game.code), 1);
    setState({ mode:'online', code: game.code, game, screen:'lobby', entryRound:1, banner:null });
  } catch(e){ handleApiError(e, { from:'home', reason:'online' }); }
}
async function joinOnline(name, code){
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  saveMe(name);
  if(!state.me.name){ toast(t('t.enterName')); return; }
  if(code.length < 3){ toast(t('t.enterCode')); return; }
  try {
    const game = await api('join', { code, playerId: state.me.id, name: state.me.name });
    LS.set('pr.session', { mode:'online', code: game.code });
    const savedRound = LS.get(roundKey(game.code), 1);
    setState({ mode:'online', code: game.code, game, screen:'lobby', entryRound: savedRound, banner:null });
  } catch(e){
    if(e.status === 404){ toast(t('t.noGame')); return; }
    handleApiError(e, { from:'home', reason:'online' });
  }
}
async function refreshOnline(){
  if(state.mode !== 'online' || !state.code) return;
  try {
    const game = await api('get', { code: state.code });
    if(JSON.stringify(game) !== JSON.stringify(state.game)) setState({ game });
  } catch(e){

function removeLocalPlayer(id){
  const players = state.local.players.filter(p => p.id !== id);
  const scores = {};
  for(const r of Object.keys(state.local.scores)){
    scores[r] = { ...state.local.scores[r] }; delete scores[r][id];
  }
  setState({ local: { ...state.local, players, scores } }); persistLocal();

function cycleLocalPlayerColor(id){
  const players = state.local.players.map(p => p.id === id
    ? { ...p, colorIndex: ((p.colorIndex ?? avatarColorIndex(p.id)) + 1) % AVATAR_COLORS.length }
    : p);
  setState({ local: { ...state.local, players } }); persistLocal();
}
function reorderLocalPlayer(id, toIndex){
  const players = [...state.local.players];
  const from = players.findIndex(p => p.id === id);
  if(from === -1 || from === toIndex) return;
  const [p] = players.splice(from, 1);
  players.splice(Math.max(0, Math.min(toIndex, players.length)), 0, p);
  setState({ local: { ...state.local, players } }); persistLocal();
}

    entryRound: round,

async function saveEntry(){
  const round = state.entryRound;
  const dice = diceForRound(state.fields, round);
  if(state.mode === 'local'){
    const scored = scoreRound(dice);
    const scores = { ...state.local.scores };
    scores[round] = { ...(scores[round] || {}) };
    scores[round][state.entryPlayerId] = { total: scored.total, breakdown: scored.breakdown, dice, submittedAt: Date.now() };
    const local = { ...state.local, scores };
    setState({ local, screen:'lobby' });
    persistLocal();
    const nextUnscored = local.players.find(p => !(scores[round] && scores[round][p.id]));
    if(nextUnscored){
      toast(t('t.savedNext', { name: nextUnscored.name }));
    } else {
      // Every player has entered this round — announce the leader. A
      // completed final round gets the bigger "game over" toast instead.
      const totals = totalsFor({ players: local.players, scores: local.scores });
      const top = totals[0];
      if(round === ROUNDS){
        toast(t('board.winner', { name: top.name, n: top.total }), 5000);
      } else {
        toast(t('t.roundLeader', { name: top.name, n: top.total, r: round }), 5000);
      }
    }
    return;
  }
  try {
    const game = await api('score', { code: state.code, playerId: state.me.id, round, dice });
    const next = Math.min(ROUNDS, round + 1);
    LS.set(roundKey(state.code), next);
    setState({ game, screen:'lobby', entryRound: next, fields: emptyFields(), photo:null });
    toast(t('t.roundSaved', { n: round }));
  } catch(e){ handleApiError(e); }
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// Render a scannable QR code as inline SVG (offline, from the vendored lib).
// Returns '' if the lib somehow didn't load, so the copyable link still shows.
function qrSvg(text, px){
  try {
    const gen = (typeof window !== 'undefined' && window.qrcode) || (typeof qrcode !== 'undefined' ? qrcode : null);
    if(!gen) return '';
    const qr = gen(0, 'M');          // type 0 = auto-size, medium error correction
    qr.addData(String(text));
    qr.make();
    const n = qr.getModuleCount();
    const quiet = 2;                  // quiet-zone modules on each side
    const dim = n + quiet * 2;
    let rects = '';
    for(let r = 0; r < n; r++){
      for(let c = 0; c < n; c++){
        if(qr.isDark(r, c)) rects += `<rect x="${c + quiet}" y="${r + quiet}" width="1" height="1"/>`;
      }
    }
    const size = px || 180;
    return `<svg class="qr" width="${size}" height="${size}" viewBox="0 0 ${dim} ${dim}" role="img" aria-label="QR code" shape-rendering="crispEdges">
      <rect width="${dim}" height="${dim}" fill="#ffffff"/>
      <g fill="#000000">${rects}</g>
    </svg>`;
  } catch { return ''; }
}

  const app = document.getElementById('app');
  let body = '';
  if(state.screen === 'home') body = renderHome();
  else if(state.screen === 'lobby') body = renderLobby();
  else if(state.screen === 'entry') body = renderEntry();
  else if(state.screen === 'board') body = renderBoard();
  else if(state.screen === 'credits') body = renderCredits();
  else if(state.screen === 'upgrade') body = renderUpgrade();
  else if(state.screen === 'hof') body = renderHof();

  const chrome = state.screen !== 'home';
  app.dataset.screen = state.screen;
  app.dataset.tabs = 'y';
  app.innerHTML = `
    ${chrome ? renderTopbar() : ''}
    <div class="screen">${body}</div>
    ${state.toast ? `<div class="toast">${esc(state.toast)}</div>` : ''}
    ${renderTabbar()}
    ${state.backMenuOpen ? renderBackMenu() : ''}
  `;
  bind();
  syncPolling();
}

function renderLobby(){
  const v = view();
  const me = state.me.id;
  const round = state.entryRound;

  // Standings — the LIST ORDER reflects last round's results (so the phone
  // naturally passes to whoever's turn feels "next" by recent momentum, or
  // so separate-phones players see who's hot), but each name still carries
  // its overall #rank (aggregate total across all rounds so far) and a
  // pity-die ribbon for whoever's currently lowest overall — e.g. the
  // round-3 winner can sit at the top of the list while still showing "#2"
  // if someone else leads the aggregate score. Applies to both modes —
  // scores are already fully visible to everyone via the Scoreboard tab
  // regardless of mode, so surfacing them here too reveals nothing new.
  const totals = totalsFor(v); // sorted desc by aggregate total
  const showRankings = totals.some(p => p.total > 0);
  const pinkCount = pinkDiceFor(v.players.length);
  const bottomIds = showRankings ? new Set(totals.slice(Math.max(0, totals.length - pinkCount)).map(p => p.id)) : new Set();

  // Overall rank number per player, competition-style (ties share a rank;
  // the next distinct total skips accordingly).
  const rankOf = new Map();
  if(showRankings){
    let rank = 0, seen = 0, prevTotal = null;
    for(const p of totals){
      seen++;
      if(p.total !== prevTotal){ rank = seen; prevTotal = p.total; }
      rankOf.set(p.id, rank);
    }
  }

  const prevRound = round - 1;
  const orderedPlayers = prevRound >= 1
    ? [...v.players].sort((a, b) => {
        const sa = (v.scores[prevRound] && v.scores[prevRound][a.id]) ? v.scores[prevRound][a.id].total : 0;
        const sb = (v.scores[prevRound] && v.scores[prevRound][b.id]) ? v.scores[prevRound][b.id].total : 0;
        return sb - sa;
      })
    : (showRankings ? totals : v.players);
  const started = v.isLocal && Object.keys(v.scores).length > 0;

  const playerList = orderedPlayers.length ? orderedPlayers.map(p => {
    const done = v.scores[round] && v.scores[round][p.id];
    const isMe = !v.isLocal && p.id === me;
    const rankTag = rankOf.has(p.id) ? ` <span class="rank-tag" title="Overall rank">#${rankOf.get(p.id)}</span>` : '';
    const pityTag = bottomIds.has(p.id) ? ' <span class="rank-tag" title="Pity die">🎀</span>' : '';
    return `
      <div class="player-row" data-pid="${p.id}">
        ${v.isLocal ? `<span class="drag-handle" data-id="${p.id}" aria-label="${esc(t('local.reorder'))}">⠿</span>` : ''}
        <div class="avatar" ${v.isLocal ? `data-a="cycle-color" data-id="${p.id}"` : ''} style="background:${playerColor(p)}">${esc((p.name || '?')[0].toUpperCase())}</div>
        <div class="name">${esc(p.name)}${rankTag}${pityTag}${isMe ? `<span class="you-tag">${esc(t('you'))}</span>` : ''}</div>
        ${v.isLocal
          ? `<button class="pill-btn ${done ? 'done' : ''}" data-a="score-player" data-id="${p.id}">${done ? `✓ ${done.total}` : esc(t('enterDice'))}</button>
             <button class="icon-btn" data-a="rm-player" data-id="${p.id}">✕</button>`
          : `<span class="status ${done ? 'done' : ''}">${done ? `✓ ${done.total}` : esc(t('waiting'))}</span>`}
      </div>`;
  }).join('') : `<div class="player-row"><span class="small-note">${esc(t('noPlayers'))}</span></div>`;

  const myEntry = v.scores[round] && v.scores[round][me];

  // "Initial screen" = setup, before any round has been scored. Code sharing
  // only appears here (online), never once play is underway or past setup.
  const anyScored = Object.keys(v.scores).length > 0;
  const showShare = !v.isLocal && !anyScored;

  // Pass-and-play hand-off: who should get the phone next this round.
  const nextLocal = v.isLocal ? orderedPlayers.find(p => !(v.scores[round] && v.scores[round][p.id])) : null;

  return `
    ${state.banner ? `<div class="banner ${state.bannerKind === 'info' ? 'info' : ''}">${esc(state.banner)}</div>` : ''}

    ${showShare ? `
      <div class="code-display">
        <div class="label">${esc(t('shareCode'))}</div>
        <div class="code-big">${esc(v.code)}</div>
      </div>
      ${v.hostId === me ? `
        <div class="share-block">
          <div class="qr-wrap">${qrSvg(`${location.origin}/?code=${v.code}`)}</div>
          <p class="small-note share-hint">${esc(t('share.scan'))}</p>
          <button class="btn btn-secondary" data-a="copy-link">${esc(t('copyLink'))}</button>
        </div>
      ` : ''}
    ` : ''}

    <div class="section-title">${esc(t('round'))}</div>
    <div class="round-picker">
      <button data-a="round-prev">−</button>
      <div class="round-label">${t('roundOf', { n: round, total: ROUNDS })}</div>
      <button data-a="round-next">+</button>
    </div>

    ${v.isLocal && v.players.length >= 2 ? `<p class="small-note">${esc(t('local.diceHint', { n: v.players.length, p: pinkCount }))}</p>` : ''}

    ${nextLocal ? `
      <div class="passto">
        <div class="passto-lab">${esc(t('local.passTo'))}</div>
        <button class="btn btn-primary passto-btn" data-a="score-player" data-id="${nextLocal.id}">
          <span class="passto-avatar" style="background:${playerColor(nextLocal)}">${esc((nextLocal.name || '?')[0].toUpperCase())}</span>
          ${esc(t('local.handTo', { name: nextLocal.name }))}
        </button>
      </div>
    ` : ''}

    <div class="section-title">${esc(v.isLocal ? t('players.tap') : t('players'))}</div>
    <div class="card" style="padding:4px 14px;">${playerList}</div>

    ${v.isLocal ? (anyScored ? '' : `
      <div class="add-row">
        <input class="text-input" id="addPlayer" placeholder="${esc(t('ph.addPlayer'))}" autocomplete="off" />
        <button class="btn btn-secondary" data-a="add-player">${esc(t('add'))}</button>
      </div>
    `) : `
      <button class="btn btn-primary" data-a="score-self">
        ${esc(myEntry ? t('editMyRound', { n: round }) : t('enterMyDice', { n: round }))}
      </button>
    `}

    <p class="small-note">${esc(t('lobby.note'))}</p>
  `;
}

function renderEntry(){
  const v = view();
  const p = v.players.find(x => x.id === state.entryPlayerId);
  const isR1 = state.entryRound === 1;
  const dice = diceForRound(state.fields, state.entryRound);
  const scored = scoreRound(dice);
  const visibleRows = isR1 ? ENTRY_ROWS.filter(r => r.color === 'yellow') : ENTRY_ROWS;

  // Photo scanning: hidden entirely unless the aiEnabled flag is on (it's a
  // Pro feature still being worked on). When shown, it's Pro-gated.
  const aiShown = aiAvailable && state.flags.aiEnabled !== false && !isR1;
  const aiNeedsPro = state.flags.paywallEnabled && state.flags.aiPaywalled && !state.pro;
  const photoSection = aiShown ? `
    <div class="photo-section">
      <div class="section-title">${esc(t('photo.section'))}${aiNeedsPro ? ` <span class="pro-badge">${esc(t('pro.badge'))}</span>` : ''}</div>
      <label class="capture-zone" for="photoInput">
        <div class="icon">📷</div>
        <div>
          <div class="cta">${esc(state.photo ? t('retakePhoto') : t('scanPhoto'))}</div>
          <div class="hint">${esc(t('photo.help'))}</div>
        </div>
      </label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" />
      ${state.photo ? `
        <div class="thumb-row">
          <img src="${state.photo}" alt="dice" />
          <div class="status">${state.analyzing ? `<span class="spinner"></span> ${esc(t('photo.reading'))}` : esc(t('photo.applied', { n: state.photoCount || 0 }))}</div>
        </div>` : ''}
      ${state.analyzeError ? `<div class="banner">${esc(state.analyzeError)}</div>` : ''}
    </div>` : '';

  // Single row of colored dice — one per color, no stacking. Tap a die to
  // select that color; its input(s) + calc description expand BELOW the row.
  // The die face shows that color's running score (— when nothing entered).
  const openColor = state.entryOpenColor;
  const diceRow = visibleRows.map(r => {
    const isOpen = openColor === r.color;
    const anyEntered = r.fields.some(f => (state.fields[f.key] || '').trim());
    const cell = pdfColumns(dice, scored).find(c => c.color === r.color);
    const face = anyEntered && cell ? cell.val : '';
    return `
      <button class="dcell ${isOpen ? 'open' : ''}" data-a="acc-toggle" data-color="${r.color}"
              aria-expanded="${isOpen ? 'true' : 'false'}" aria-label="${esc(t('color.' + r.color))}">
        <span class="dface" style="background:${COLOR_HEX[r.color]}">${anyEntered ? face : ''}</span>
        <span class="dname">${esc(t('color.' + r.color))}</span>
      </button>`;
  }).join('');

  // The expanded panel for the currently-selected color: its input(s) plus a
  // plain-language description of how that color is scored (replaces the old
  // stranded Blue/Red legend, which now shows only when that color is open).
  const openRow = visibleRows.find(r => r.color === openColor);
  const openMath = openRow ? colorMath(openRow.color, state.fields) : '';
  const expandPanel = openRow ? `
    <div class="dexpand">
      <div class="dexpand-head">
        <span class="dot" style="background:${COLOR_HEX[openRow.color]}"></span>
        <span class="acc-lab">${esc(t('color.' + openRow.color))}</span>
      </div>
      <div class="acc-ins">
        ${openRow.fields.map(f => `
          <label class="acc-field">
            ${openRow.fields.length > 1 ? `<span class="acc-flab">${esc(t(f.phKey))}</span>` : ''}
            <input data-field="${f.key}" value="${esc(state.fields[f.key] || '')}"
                   placeholder="${esc(isR1 ? t('ph.egN') : t(f.phKey))}" class="${f.accent ? 'accent' : ''}"
                   type="text" inputmode="numeric" pattern="[0-9 ,]*" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
          </label>`).join('')}
      </div>
      <div class="acc-math">${openMath ? esc(openMath) : `<span class="er-empty">${esc(t('calc.' + openRow.color))}</span>`}</div>
      <p class="dcalc">${esc(t('calc.' + openRow.color))}</p>
    </div>` : '';

  return `
    <h2 style="font-size:1.2rem;">${esc(p ? t('entry.titleWho', { n: state.entryRound, name: p.name }) : t('entry.title', { n: state.entryRound }))}</h2>
    <p class="small-note" style="margin-top:4px;">${esc(isR1 ? t('entry.r1note') : t('entry.note'))}</p>

    <div class="dice-row">${diceRow}</div>
    ${expandPanel}

    <!-- current round's score row — tap to expand the full PDF scorecard -->
    <button class="round-row" data-a="sheet-toggle" aria-expanded="${state.sheetExpanded ? 'true' : 'false'}">
      <div class="rr-top">
        <span class="rr-total">${scored.total}</span>
        <span class="rr-label">${esc(t('roundScore', { n: state.entryRound }))}</span>
        <span class="rr-caret">${esc(t('entry.fullSheet'))} ⤒</span>
      </div>
      ${scoreStripHtml(dice, scored)}
    </button>

    <button class="btn btn-primary" data-a="save-entry">${esc(t('saveRound', { n: state.entryRound }))}</button>
    <button class="btn btn-ghost" data-a="tab-play">${esc(t('back'))}</button>

    ${photoSection}

    ${state.sheetExpanded ? renderScoreSheet(v) : ''}
  `;
}

// Full PDF-style scorecard as a bottom sheet — all 10 rounds × 8 columns for
// the current player, current round highlighted, other rounds dimmed/blurred.
function renderScoreSheet(v){
  const pid = state.entryPlayerId;
  const now = state.entryRound;
  const cols = [
    { color:'yellow', k:'yellowSum', label:t('sheet.yellow') },
    { color:'purple', k:'purpleSum', label:t('sheet.purple') },
    { color:'blue',   k:'blueScore', label:t('sheet.blue') },
    { color:'red',    k:'redScore',  label:t('sheet.red') },
    { color:'green',  k:'greenSum',  label:t('sheet.green') },
    { color:'clear',  k:'clearSum',  label:t('sheet.white') },
    { color:'pink',   k:'pinkSum',   label:t('sheet.pink') },
  ];
  // For the currently-open round, reflect the in-progress (unsaved) entry so
  // the sheet is live; other rounds read from saved scores.
  const liveDice = diceForRound(state.fields, now);
  const liveScored = scoreRound(liveDice);
  let grand = 0;
  const rowsHtml = Array.from({ length: ROUNDS }, (_, i) => {
    const rn = i + 1;
    const saved = v.scores[rn] && v.scores[rn][pid];
    const bd = rn === now ? liveScored.breakdown : (saved ? saved.breakdown : null);
    const total = rn === now ? liveScored.total : (saved ? saved.total : null);
    if(total != null) grand += total;
    const dim = rn !== now ? 'dim' : '';
    const cells = cols.map(col => {
      const val = bd ? bd[col.k] : null;
      return `<td class="${rn === now ? 'now' : ''}">${bd ? (val ?? 0) : '—'}</td>`;
    }).join('');
    return `<tr class="${dim} ${rn === now ? 'now-row' : ''}">
      <td class="rnum">${rn}</td>${cells}
      <td class="rtot">${total != null ? total : '—'}</td>
    </tr>`;
  }).join('');
  return `
    <div class="sheet-backdrop" data-a="sheet-close"></div>
    <div class="sheet" role="dialog" aria-label="${esc(t('entry.fullSheet'))}">
      <button class="sheet-grab" data-a="sheet-close" aria-label="${esc(t('menu.close'))}"></button>
      <div class="sheet-scroll">
        <table class="sheet-table">
          <thead>
            <tr>
              <th>${esc(t('board.round') || 'R')}</th>
              ${cols.map(c => `<th><span class="th-dot" style="background:${COLOR_HEX[c.color]}"></span>${esc(c.label)}</th>`).join('')}
              <th>${esc(t('sheet.rowTotal'))}</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
          <tfoot>
            <tr><td colspan="${cols.length + 1}" class="grand-lab">${esc(t('sheet.grandTotal'))}</td><td class="rtot">${grand}</td></tr>
          </tfoot>
        </table>
      </div>
    </div>`;
}

// Human-readable math for one color, from the current field values — shown
// directly below that color's open input on the entry accordion.
//   yellow/green/clear/pink : a + b + c = sum
//   purple                  : (a + b) ×2 = n
//   blue                    : (a + b) [✨×2] = n   (doubled if any glitter die)
//   red                     : (+a + b − c) × N = n  (signed, ×count of red dice)
function colorMath(color, fields){
  const vals = (k) => parseValues(fields[k] || '');
  if(color === 'blue'){
    const plain = vals('blue'), glit = vals('blueGlitter');
    const all = [...plain, ...glit];
    if(!all.length) return '';
    const sum = all.reduce((s, n) => s + n, 0);
    const doubled = glit.length > 0;
    const inner = all.join(' + ');
    const base = all.length > 1 ? `(${inner})` : `${inner}`;
    return doubled ? `${base} ✨×2 = ${sum * 2}` : `${inner} = ${sum}`;
  }
  if(color === 'red'){
    const white = vals('redWhite'), black = vals('redBlack');
    const count = white.length + black.length;
    if(!count) return '';
    const signed = white.reduce((s, n) => s + n, 0) - black.reduce((s, n) => s + n, 0);
    const parts = [
      ...white.map(n => `+ ${n}`),
      ...black.map(n => `− ${n}`),
    ].join(' ').replace(/^\+ /, '');
    const inner = count > 1 ? `(${parts})` : `${parts}`;
    return `${inner} × ${count} = ${signed * count}`;
  }
  const v = vals(color);
  if(!v.length) return '';
  const sum = v.reduce((s, n) => s + n, 0);
  if(color === 'purple'){
    const inner = v.join(' + ');
    const base = v.length > 1 ? `(${inner})` : `${inner}`;
    return `${base} ×2 = ${sum * 2}`;
  }
  return `${v.join(' + ')} = ${sum}`;
}

// The eight scoreboard columns, in the exact order of the printed score
// sheet: Yellow, Purple ×2, Blue (×2 glitter), Red × #red, Green, White
// (engine 'clear'), Pink, then Row Total. ALWAYS returns all eight, even
// when a color has no dice this round (shown as a dash) — matching the PDF,
// which prints every column every round.
function pdfColumns(dice, scored){
  const b = scored.breakdown, c = scored.counts;
  const cell = (has, val) => ({ has: !!has, val });
  return [
    { key:'yellow', color:'yellow', label: t('sheet.yellow'), ...cell(c.yellow, b.yellowSum) },
    { key:'purple', color:'purple', label: t('sheet.purple'), ...cell(c.purple, b.purpleSum) },
    { key:'blue',   color:'blue',   label: t('sheet.blue'),   ...cell(c.blue,   b.blueScore) },
    { key:'red',    color:'red',    label: t('sheet.red'),    ...cell(c.red,    b.redScore) },
    { key:'green',  color:'green',  label: t('sheet.green'),  ...cell(c.green,  b.greenSum) },
    { key:'clear',  color:'clear',  label: t('sheet.white'),  ...cell(c.clear,  b.clearSum) },
    { key:'pink',   color:'pink',   label: t('sheet.pink'),   ...cell(c.pink,   b.pinkSum) },
  ];
}

// Render the PDF-style horizontal score strip: every color column (dash when
// empty) followed by the Row Total at the end.
function scoreStripHtml(dice, scored){
  const cols = pdfColumns(dice, scored);
  const cells = cols.map(col => `
    <div class="ss-col${col.has ? '' : ' empty'}">
      <span class="ss-dot" style="background:${COLOR_HEX[col.color]}"></span>
      <span class="ss-lab">${esc(col.label)}</span>
      <span class="ss-val">${col.has ? col.val : '—'}</span>
    </div>`).join('');
  return `<div class="score-strip">
    ${cells}
    <div class="ss-col ss-total">
      <span class="ss-lab">${esc(t('sheet.rowTotal'))}</span>
      <span class="ss-val">${scored.total}</span>
    </div>
  </div>`;
}

function renderBoard(){
  const v = view();
  if(!v || !v.players.length){
    return `<div class="empty-state"><div class="icon">🏮</div>${esc(v && v.isLocal ? t('board.emptyLocal') : t('board.emptyOnline'))}</div>`;
  }
  const now = state.entryRound;
  const localFinished = v.isLocal && v.players.every(p => v.scores[ROUNDS] && v.scores[ROUNDS][p.id]);

  // Aggregate totals (for the Total column + who's actually winning).
  const agg = totalsFor(v);
  const topAgg = agg.length ? agg[0].total : 0;
  const aggTotal = Object.fromEntries(agg.map(p => [p.id, p.total]));
  const gameOver = (localFinished || (!v.isLocal && state.game && state.game.finished)) && agg.length && topAgg > 0;

  // Last completed round = the highest round every-or-any player has scored;
  // use the most recent round that has at least one entry.
  let lastRound = 0;
  for(let r = ROUNDS; r >= 1; r--){ if(v.scores[r] && Object.keys(v.scores[r]).length){ lastRound = r; break; } }
  const lastScore = (pid) => (lastRound && v.scores[lastRound] && v.scores[lastRound][pid]) ? v.scores[lastRound][pid].total : null;

  // Sort rows by LAST ROUND's position (desc); players with no last-round
  // entry sink to the bottom, then break ties by aggregate.
  const rows = [...v.players].sort((a, b) => {
    const sa = lastScore(a.id), sb = lastScore(b.id);
    if(sa == null && sb == null) return (aggTotal[b.id] || 0) - (aggTotal[a.id] || 0);
    if(sa == null) return 1;
    if(sb == null) return -1;
    if(sb !== sa) return sb - sa;
    return (aggTotal[b.id] || 0) - (aggTotal[a.id] || 0);
  });

  // 🐼 to the top scorer of the last round (ties share it); 🎀 pity bows to
  // the bottom N by last-round score, N = pinkDiceFor(playerCount).
  const scoredLast = rows.filter(p => lastScore(p.id) != null);
  const topLast = scoredLast.length ? Math.max(...scoredLast.map(p => lastScore(p.id))) : null;
  const pityN = pinkDiceFor(v.players.length);
  const pityIds = new Set(scoredLast.slice(Math.max(0, scoredLast.length - pityN)).map(p => p.id));

  const diceForCell = (pid, rn) => {
    const e = v.scores[rn] && v.scores[rn][pid];
    if(!e || !e.dice || !e.dice.length) return '';
    return e.dice.map(d => `<span class="brd-die" title="${esc(d.color)} ${d.value}" style="background:${COLOR_HEX[d.color] || '#888'}">${d.value}</span>`).join('');
  };

  return `
    <h2 style="font-size:1.2rem;">${esc(t('tab.board'))}</h2>
    ${gameOver ? `<div class="banner info">${esc(t('board.winner', { name: agg[0].name, n: topAgg }))}</div>` : ''}
    ${gameOver && v.isLocal ? `<button class="btn btn-primary" data-a="new-match">${esc(t('local.newMatch'))}</button>` : ''}
    <div style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
      <table class="board">
        <thead>
          <tr>
            <th class="name-cell">${esc(t('board.player'))}</th>
            ${Array.from({ length: ROUNDS }, (_, i) => `<th class="${i + 1 === now ? 'now' : ''}">R${i + 1}</th>`).join('')}
            <th>${esc(t('board.total'))}</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(p => {
            const isTop = topLast != null && lastScore(p.id) === topLast;
            const isPity = pityIds.has(p.id);
            const expanded = state.boardOpenPid === p.id;
            return `
            <tr class="${aggTotal[p.id] === topAgg && topAgg !== 0 ? 'leader' : ''} brd-row" data-a="board-row" data-pid="${p.id}">
              <td class="name-cell">${isTop ? '🐼 ' : ''}${isPity ? '🎀 ' : ''}${esc(p.name)}</td>
              ${Array.from({ length: ROUNDS }, (_, i) => {
                const e = v.scores[i + 1] && v.scores[i + 1][p.id];
                return `<td class="${i + 1 === now ? 'now' : ''}">${e ? e.total : '—'}</td>`;
              }).join('')}
              <td class="total-cell">${aggTotal[p.id] || 0}</td>
            </tr>
            ${expanded ? `
              <tr class="brd-dice-row">
                <td colspan="${ROUNDS + 2}">
                  <div class="brd-dice-detail">
                    ${Array.from({ length: ROUNDS }, (_, i) => {
                      const pips = diceForCell(p.id, i + 1);
                      return pips ? `<div class="brd-dice-round"><span class="brd-rnum">R${i + 1}</span>${pips}</div>` : '';
                    }).join('') || `<span class="er-empty">${esc(t('board.noDice'))}</span>`}
                  </div>
                </td>
              </tr>` : ''}`;
          }).join('')}
        </tbody>
      </table>
    </div>
    <p class="small-note">${esc(t('board.tapRow'))}</p>
    ${v.isLocal ? '' : `<p class="small-note">${esc(t('board.updates'))}</p>`}
    <button class="btn btn-ghost" data-a="tab-play">${esc(t('board.backPlayers'))}</button>
  `;
}

/* ------------------------------------------------------------------ *
 * events
 * ------------------------------------------------------------------ */
function bind(){
  const app = document.getElementById('app');

  app.onclick = async (e) => {
    const el = e.target.closest('[data-a]');
    if(!el) return;
    const a = el.dataset.a;
    const id = el.dataset.id;

    if(a === 'lang'){ return; }
    if(a === 'menu-toggle'){ setState({ menuOpen: !state.menuOpen }); return; }
    if(a === 'back-cancel'){ setState({ backMenuOpen: false }); return; }
    if(a === 'back-new'){ setState({ backMenuOpen: false }); hostNewGame(); return; }
    if(a === 'back-leave'){ setState({ backMenuOpen: false }); leaveGame(); return; }
    if(a === 'menu-close'){ setState({ menuOpen: false }); return; }
    if(a === 'menu-theme'){ toggleTheme(); setState({ menuOpen: false }); return; }
    if(a === 'menu-hof'){ setState({ screen:'hof', menuOpen:false }); return; }
    if(a === 'hof-back'){ setState({ screen: state.mode ? 'lobby' : 'home' }); return; }
    if(a === 'menu-edit-name'){ promptEditName(); return; }
    if(a === 'menu-edit-players'){ setState({ screen:'lobby', menuOpen:false }); toast(t('menu.editPlayersHint')); return; }
    if(a === 'menu-host-new'){ setState({ menuOpen:false }); hostNewGame(); return; }
    if(a === 'create-online'){ createOnline(readNameInput()); return; }
    else if(a === 'start-local'){ if(!ensureNameForLocal()) return; startLocal(); }
    else if(a === 'new-local'){ LS.del('pr.local'); startLocal(); }
    else if(a === 'leave') leaveGame();
    else if(a === 'tab-play') setState({ screen:'lobby', menuOpen:false });
    else if(a === 'tab-board') setState({ screen:'board', menuOpen:false });
    else if(a === 'tab-credits') setState({ screen:'credits', menuOpen:false });
    else if(a === 'credits-back') setState({ screen: state.mode ? 'lobby' : 'home' });
    else if(a === 'go-credits') setState({ screen:'credits' });
    else if(a === 'upgrade-back') setState({ screen: state.upgradeFrom || 'home' });
    else if(a === 'checkout'){
      const email = (document.getElementById('upgradeEmail')?.value || '').trim();
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op: 'checkout', email: email || undefined }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.status === 503){ toast(t('upgrade.billingOff')); return; }
        if(!r.ok || !data.url){ toast(t('t.wrong')); return; }
        location.href = data.url;
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'redeem-code'){
      const inp = document.getElementById('redeemInput');
      const code = (inp?.value || '').trim().toUpperCase();
      if(!code) return;
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op: 'redeem', code }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.ok && data.ok){
          state.pro = { code, email: data.email || null };
          LS.set('pr.pro', state.pro);
          toast(t('upgrade.redeemOk'));
          // Stay put (rather than auto-navigating away) so the "save an
          // account" offer below is actually reachable right after redeeming.
          render();
        } else if(data.error === 'retired'){
          toast(t('upgrade.redeemRetired'));
          setState({ showLoginForm: true });
        } else {
          toast(t('upgrade.redeemBad'));
        }
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'show-register') setState({ showRegisterForm: true });
    else if(a === 'show-login') setState({ showLoginForm: true });
    else if(a === 'register-account'){
      const email = (document.getElementById('registerEmail')?.value || '').trim();
      const password = document.getElementById('registerPassword')?.value || '';
      if(password.length < 8){ toast(t('auth.passwordShort')); return; }
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op:'register', email, code: state.pro?.code, password }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.ok && data.ok){
          state.pro = { code: data.code, email: data.email };
          LS.set('pr.pro', state.pro);
          setState({ loggedIn: true, showRegisterForm: false });
          toast(t('auth.accountCreated'));
        } else if(data.error === 'email_taken'){ toast(t('auth.emailTaken')); }
        else if(data.error === 'invalid_code'){ toast(t('auth.invalidCode')); }
        else if(data.error === 'retired'){ toast(t('upgrade.redeemRetired')); setState({ showLoginForm: true }); }
        else if(data.error === 'email_mismatch'){ toast(t('auth.emailMismatch')); }
        else { toast(t('t.wrong')); }
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'login-account'){
      const email = (document.getElementById('loginEmail')?.value || '').trim();
      const password = document.getElementById('loginPassword')?.value || '';
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op:'login', email, password }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.ok && data.ok){
          state.pro = { code: data.code, email: data.email };
          LS.set('pr.pro', state.pro);
          setState({ loggedIn: true, showLoginForm: false });
          toast(t('auth.loggedIn'));
        } else {
          toast(t('auth.invalidCredentials'));
        }
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'logout-account'){
      try { await fetch('/api/billing', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ op:'logout' }) }); }
      catch {}
      setState({ loggedIn: false });
      toast(t('auth.loggedOut'));
    }
    else if(a === 'refresh'){ await refreshOnline(); toast(t('t.updated')); }
    else if(a === 'round-prev') setState({ entryRound: Math.max(1, state.entryRound - 1) });
    else if(a === 'round-next') setState({ entryRound: Math.min(ROUNDS, state.entryRound + 1) });
    else if(a === 'add-player'){
      const inp = document.getElementById('addPlayer');
      addLocalPlayer(inp.value); inp.value = '';
    }
    else if(a === 'rm-player') removeLocalPlayer(id);
    else if(a === 'cycle-color') cycleLocalPlayerColor(id);
    else if(a === 'new-match') resetLocalMatch();
    else if(a === 'score-player') openEntry(id, state.entryRound);
    else if(a === 'score-self') openEntry(state.me.id, state.entryRound);
    else if(a === 'save-entry') saveEntry();
    else if(a === 'acc-toggle'){
      const color = el.dataset.color;
      setState({ entryOpenColor: state.entryOpenColor === color ? null : color });
      const first = document.querySelector('.dexpand .acc-ins input');
      if(first){ first.focus(); }
    }
    else if(a === 'sheet-toggle') setState({ sheetExpanded: !state.sheetExpanded });
    else if(a === 'sheet-close') setState({ sheetExpanded: false });
    else if(a === 'board-row'){ const pid = el.dataset.pid; setState({ boardOpenPid: state.boardOpenPid === pid ? null : pid }); }
    else if(a === 'copy-link'){
      const link = `${location.origin}/?code=${view().code}`;
      try { await navigator.clipboard.writeText(link); toast(t('t.linkCopied')); }
      catch { toast(link); }
    }
    else if(a === 'reset-scores'){
      if(!confirm(t('confirm.wipe'))) return;
      try { const game = await api('reset', { code: state.code, playerId: state.me.id }); setState({ game }); toast(t('t.scoresCleared')); }
      catch(err){ handleApiError(err); }
    }
  };

  app.onchange = (e) => {
    const sel = e.target.closest('select[data-a="lang"]');
    if(sel) setLang(sel.value);
  };

  // Double-click a player's name to rename. Local: rename that player.
  // Online: only your own name is editable (others belong to their devices).
  app.ondblclick = (e) => {
    const nameEl = e.target.closest('.player-row .name');
    if(!nameEl) return;
    const row = nameEl.closest('.player-row');
    const pid = row && row.dataset.pid;
    if(!pid) return;
    const v = view();
    if(v && v.isLocal){
      const p = v.players.find(x => x.id === pid);
      const next = window.prompt(t('menu.editName'), p ? p.name : '');
      if(next == null) return;
      renameLocalPlayer(pid, next);
    } else if(pid === state.me.id){
      promptEditName();
    }
  };

  // live recalculation on every keystroke + tidy on blur
  app.oninput = (e) => {
    const inp = e.target.closest('[data-field]');
    if(!inp) return;
    // Numbers only: strip anything that isn't a digit, space, or comma
    // (covers pasted text and soft-keyboard characters that slip past the
    // numeric inputmode hint). Preserve caret position when nothing changed.
    const cleaned = inp.value.replace(/[^0-9 ,]/g, '');
    if(cleaned !== inp.value){
      const pos = inp.selectionStart;
      inp.value = cleaned;
      try { inp.setSelectionRange(pos - 1, pos - 1); } catch {}
    }
    state.fields = { ...state.fields, [inp.dataset.field]: inp.value };
    updateEntryTotals();
  };
  app.onfocusout = (e) => {
    const inp = e.target.closest('[data-field]');
    if(!inp) return;
    const tidy = parseValues(inp.value).join(' ');
    if(tidy !== inp.value){ inp.value = tidy; state.fields[inp.dataset.field] = tidy; }
    updateEntryTotals();
  };
  app.onfocusin = (e) => {
    const inp = e.target.closest('[data-field]');
    if(inp) inp.select();
  };

  // Enter tabs to the next dice-entry field, or to Save once past the last one.
  app.onkeydown = (e) => {
    if(e.key !== 'Enter') return;
    const inp = e.target.closest('[data-field]');
    if(!inp) return;
    e.preventDefault();
    const fields = [...document.querySelectorAll('.entry-grid [data-field]')];
    const i = fields.indexOf(inp);
    const next = fields[i + 1];
    if(next) next.focus();
    else document.querySelector('[data-a="save-entry"]')?.focus();
  };

  // Local-mode player reordering: pointer-based drag (native HTML5 drag
  // doesn't work reliably on mobile touch, and this app lives on a phone
  // at the table). Drag the handle; drop position is resolved once, at
  // release, against each row's pre-drag position — simpler and more
  // reliable than live-reflowing every sibling mid-drag.
  app.onpointerdown = (e) => {
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const row = handle.closest('.player-row');
    const rows = [...row.parentElement.querySelectorAll('.player-row')];
    dragState = {
      id: handle.dataset.id,
      row,
      pointerId: e.pointerId,
      startY: e.clientY,
      rowHeight: row.getBoundingClientRect().height,
      rects: rows.map(r => r.getBoundingClientRect()),
    };
    row.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  };
  app.onpointermove = (e) => {
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    dragState.row.style.transform = `translateY(${e.clientY - dragState.startY}px)`;
  };
  const endDrag = (e) => {
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    const dy = e.clientY - dragState.startY;
    dragState.row.style.transform = '';
    dragState.row.classList.remove('dragging');
    const draggedIndex = [...dragState.row.parentElement.querySelectorAll('.player-row')].indexOf(dragState.row);
    const draggedCenterY = dragState.rects[draggedIndex].top + dragState.rowHeight / 2 + dy;
    let toIndex = dragState.rects.length - 1;
    for(let i = 0; i < dragState.rects.length; i++){
      if(draggedCenterY < dragState.rects[i].top + dragState.rowHeight / 2){ toIndex = i; break; }
    }
    reorderLocalPlayer(dragState.id, toIndex);
    dragState = null;
  };
  app.onpointerup = endDrag;
  app.onpointercancel = endDrag;

  const photo = document.getElementById('photoInput');
  if(photo){
    photo.onchange = async () => {
      const file = photo.files[0];
      if(!file) return;
      let dataUrl;
      try { dataUrl = await resizeImageFile(file); }
      catch { toast(t('t.badImage')); return; }
      setState({ photo: dataUrl, analyzing: true, analyzeError: null });
      try {
        const dice = await analyzePhoto(dataUrl);
        if(!dice.length){
          setState({ analyzing: false, analyzeError: t('t.noDice') });
          return;
        }
        const merged = mergeFields(state.fields, diceToFields(dice));
        const count = FIELD_KEYS.reduce((s, k) => s + (merged[k] ? String(merged[k]).trim().split(/\s+/).length : 0), 0);
        setState({ analyzing: false, fields: merged, analyzeError: null, photoCount: count });
      } catch(err){
        if(err.soft) setState({ analyzing: false, photo: null });
        else if(err.status === 402) setState({ analyzing:false, photo:null, screen:'upgrade', upgradeFrom:'entry', upgradeReason:'ai' });
        else setState({ analyzing: false, analyzeError: t('t.photoErr') });
      }
    };
  }

  const codeInput = document.getElementById('codeInput');
  if(codeInput) codeInput.oninput = () => { state._prefillCode = codeInput.value; };
}

// only overwrite fields the photo actually found something for
function mergeFields(cur, found){
  const out = { ...cur };
  for(const k of FIELD_KEYS) if(found[k]) out[k] = found[k];
  return out;
}

function updateEntryTotals(){
  const dice = diceForRound(state.fields, state.entryRound);
  const scored = scoreRound(dice);
  // round-row total + strip
  const rrTotal = document.querySelector('.round-row .rr-total');
  if(rrTotal) rrTotal.textContent = scored.total;
  const strip = document.querySelector('.round-row .score-strip');
  if(strip) strip.outerHTML = scoreStripHtml(dice, scored);
  // open color's live math + its die face in the dice row
  if(state.entryOpenColor){
    const math = colorMath(state.entryOpenColor, state.fields);
    const mathEl = document.querySelector('.dexpand .acc-math');
    if(mathEl){
      mathEl.innerHTML = math ? esc(math) : `<span class="er-empty">${esc(t('calc.' + state.entryOpenColor))}</span>`;
    }
    const cell = pdfColumns(dice, scored).find(c => c.color === state.entryOpenColor);
    const face = document.querySelector(`.dcell[data-color="${state.entryOpenColor}"] .dface`);
    if(face) face.textContent = (cell && cell.has) ? cell.val : '';
  }
  // if the full sheet is open, keep its current-round row live too
  if(state.sheetExpanded){
    const sheet = document.querySelector('.sheet');
    if(sheet){
      const v = view();
      const tmp = document.createElement('div');
      tmp.innerHTML = renderScoreSheet(v);
      const newTable = tmp.querySelector('.sheet-table');
      const curTable = sheet.querySelector('.sheet-table');
      if(newTable && curTable) curTable.innerHTML = newTable.innerHTML;
    }
  }
}

/* ------------------------------------------------------------------ *
 * boot
 * ------------------------------------------------------------------ */
// After a successful Stripe redirect (?session_id=...): the webhook that mints
// the Pro code can lag a beat behind the redirect, so poll briefly before
// falling back to "check your email".
async function handleCheckoutReturn(sessionId){
  for(let i = 0; i < 6; i++){
    try {
      const r = await fetch(`/api/billing?op=session&session_id=${encodeURIComponent(sessionId)}`);
      if(r.ok){
        const d = await r.json();
        if(d && d.code){
          state.pro = { code: d.code, email: d.email || null };
          LS.set('pr.pro', state.pro);
          history.replaceState({}, '', location.pathname);
          toast(t('upgrade.unlocked'));
          // Land on the upgrade screen so the "save an account" offer is
          // visible right after a purchase, not just after a manual redeem.
          state.screen = 'upgrade';
          state.upgradeFrom = 'home';
          render();
          return;
        }
      }
    } catch {}
    await new Promise(r => setTimeout(r, 1500));
  }
  history.replaceState({}, '', location.pathname);
  toast(t('upgrade.checkEmail'));
}

async function boot(){
  // language: saved choice, else the browser's preferred, else English
  state.lang = detectLang();
  document.documentElement.lang = state.lang;
  if(state.lang !== 'en') applyMeta(state.lang);

  // theme: saved choice, else OS preference, default dark
  const savedTheme = LS.get('pr.theme', null);
  state.theme = savedTheme || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  applyTheme(state.theme);

  // probe AI availability quietly
  fetch('/api/analyze', { method:'GET' }).then(r => { if(r.status === 503) aiAvailable = false; }).catch(() => {});
  // hall of fame (empty until a game finishes)
  fetch('/api/hof').then(r => r.json()).then(d => {
    if(d && Array.isArray(d.entries) && d.entries.length){ state.hof = d.entries; if(state.screen === 'home') render(); }
  }).catch(() => {});
  // paywall feature flags — everything defaults to free until these say otherwise
  fetch('/api/flags').then(r => r.json()).then(d => {
    if(d && typeof d === 'object'){ state.flags = { ...state.flags, ...d }; render(); }
  }).catch(() => {});
  // returning Pro login: if this browser carries a session cookie, recover
  // the Pro code without the user re-entering anything (works even if
  // localStorage was cleared but cookies weren't)
  fetch('/api/billing?op=me').then(r => r.json()).then(d => {
    if(d && d.loggedIn && d.code){
      state.pro = { code: d.code, email: d.email || null };
      LS.set('pr.pro', state.pro);
      state.loggedIn = true;
      // logged in => their saved preferences live on the server; apply them
      fetch('/api/billing?op=prefs').then(r => r.json()).then(pd => {
        const prefs = pd && pd.prefs;
        if(prefs && typeof prefs === 'object'){
          if(prefs.theme && prefs.theme !== state.theme){ state.theme = prefs.theme; LS.set('pr.theme', prefs.theme); applyTheme(prefs.theme); }
          if(prefs.lang && prefs.lang !== state.lang && I18N[prefs.lang]){ state.lang = prefs.lang; LS.set('pr.lang', prefs.lang); document.documentElement.lang = prefs.lang; applyMeta(prefs.lang); }
        }
        render();
      }).catch(() => render());
    }
  }).catch(() => {});

  const params = new URLSearchParams(location.search);
  const deepCode = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const sessionId = params.get('session_id');
  if(sessionId) handleCheckoutReturn(sessionId);

  const session = LS.get('pr.session', null);
  if(deepCode){
    // Joining/resuming via an invite URL or QR code. The seat is keyed on this
    // device's durable UUID, so if this device was already in the game its
    // scores are preserved server-side and we rejoin the SAME seat. Recover
    // the player's name from that existing seat if the local name was lost.
    let name = (state.me.name || '').trim();
    if(!name){
      try {
        const g = await api('get', { code: deepCode });
        const mine = g && g.players && g.players.find(p => p.id === state.me.id);
        if(mine && mine.name){ name = mine.name; saveMe(name); }
      } catch {}
    }
    if(name){
      try {
        const game = await api('join', { code: deepCode, playerId: state.me.id, name });
        LS.set('pr.session', { mode:'online', code: game.code });
        state.mode = 'online'; state.code = game.code; state.game = game;
        state.entryRound = LS.get(roundKey(game.code), 1);
        state.screen = 'lobby';
        try { history.replaceState({}, '', location.pathname); } catch {}
      } catch { state.pendingJoinCode = deepCode; state.screen = 'home'; }
    } else {
      // brand-new device with no name yet: ask for it, then join (createOnline
      // routes to join when pendingJoinCode is set)
      state.pendingJoinCode = deepCode;
      state.screen = 'home';
    }
  } else if(session && session.mode === 'local'){
    const local = LS.get('pr.local', null);
    if(local && local.players){ state.mode = 'local'; state.local = local; state.code = 'PASS & PLAY'; state.screen = 'lobby'; }
  } else if(session && session.mode === 'online' && session.code){
    try {
      const game = await api('get', { code: session.code });
      state.mode = 'online'; state.code = session.code; state.game = game;
      state.entryRound = LS.get(roundKey(session.code), 1);
      state.screen = 'lobby';
    } catch { LS.del('pr.session'); }
  }
  render();

  // Back-button guard: while in a game, intercept the browser Back gesture and
  // offer Leave / New game instead of silently dropping the player out.
  try { history.pushState({ prGuard: true }, ''); } catch {}
  window.addEventListener('popstate', () => {
    if(state.mode && !state.backMenuOpen){
      // re-arm the trap so a subsequent Back is caught too, then prompt
      try { history.pushState({ prGuard: true }, ''); } catch {}
      setState({ backMenuOpen: true });
    }
  });
}
boot();
</script>
