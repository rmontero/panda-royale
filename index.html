<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --night: #211a35;
    --night-deep: #171224;
    --panel: #2a2242;
    --panel-2: #322a4d;
    --panel-line: rgba(246,197,103,0.14);
    --paper: #f6f1e4;
    --lantern: #e8a13a;
    --lantern-bright: #f6c567;
    --ink: #f6f1e4;
    --ink-dim: #b7aed0;
    --muted: #8a80ab;
    --good: #7cc98a;
    --bad: #e07a72;
    --radius: 16px;

    --c-yellow: #f2c94c;
    --c-purple: #a37bff;
    --c-blue: #57a9e8;
    --c-blue-glitter: #d9b8ff;
    --c-red: #e6675f;
    --c-green: #59b980;
    --c-clear: #e9e6da;
    --c-pink: #f28fc7;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:
      radial-gradient(ellipse at 20% -10%, rgba(246,197,103,0.13), transparent 55%),
      radial-gradient(ellipse at 100% 0%, rgba(163,123,255,0.10), transparent 45%),
      var(--night-deep);
    color:var(--ink);
    min-height:100vh;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100svh;
    padding-bottom:calc(80px + env(safe-area-inset-bottom));
    position:relative;
    display:flex;
    flex-direction:column;
  }
  #app[data-tabs="n"]{ padding-bottom:0; }
  .screen{ flex:1 1 auto; }
  h1,h2,h3,.display{ font-family:'Baloo 2', system-ui, sans-serif; font-weight:700; margin:0; }
  p{ margin:0; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }

  .screen{ padding:20px 18px 12px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px; border-bottom:1px solid var(--panel-line);
  }
  .topbar .code{ font-family:'Baloo 2', monospace; letter-spacing:0.12em; font-size:1.05rem; color:var(--lantern-bright); }
  .topbar .sub{ font-size:0.8rem; color:var(--ink-dim); }
  .link-btn{ background:none; border:none; color:var(--ink-dim); font-size:0.85rem; padding:6px 4px; cursor:pointer; }

  .hero{ text-align:left; padding-top:12px; margin-bottom:6px; }
  .hero h1{ font-size:2rem; line-height:1.1; }
  .hero .sub{ color:var(--ink-dim); margin-top:8px; font-size:0.95rem; line-height:1.5; }
  .lanterns{ display:flex; gap:8px; margin-bottom:16px; }
  .lanterns span{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  label.field-label{ display:block; font-size:0.8rem; color:var(--ink-dim); margin-bottom:6px; margin-top:16px; }
  input.text-input{

    border:1px solid var(--panel-line); background:var(--panel);

  /* ============================================================ *
   * responsive — mobile first, then tablet (fluid, both orientations),
   * then desktop (fixed, consistent per-screen widths)
   * ============================================================ */

  /* short-landscape safety net, any width: a ~375-430px-tall viewport
     (a phone turned sideways) can't afford a floating bottom tabbar or
     tall hero padding without pushing content into a scroll. */
  @media (orientation: landscape) and (max-height: 500px){
    #app{ padding-bottom: 0; }
    .tabbar{ position: sticky; left: auto; right: auto; max-width: none; border-inline: 0; }
    .hero{ padding-top: 4px; }
    .hero h1{ font-size: 1.7rem; }
  }

  /* roomy layout: tablets in portrait or landscape, and phones turned
     landscape (often wider than 680px, or wide-but-short below it) —
     fluid width (min(vw, cap)) so the container uses whatever extra
     space the device has. ONE shell width for every screen — not a
     different max-width per screen — so switching tabs doesn't visibly
     resize the app; screens that are just a form or a page of text
     (home/lobby/credits) get a centered reading column inside that
     shell instead, rather than a narrower outer shell of their own. */
  @media (min-width: 680px),
         (min-width: 560px) and (max-height: 500px) and (orientation: landscape){
    body{ background-attachment: fixed; }
    #app{
      max-width: min(95vw, 900px);
      padding-bottom: 0;
      border-inline: 1px solid var(--panel-line);
      box-shadow: 0 0 90px rgba(0,0,0,0.4);
      background: rgba(23,18,36,0.30);
    }
    .screen{ padding: 26px 32px 22px; }
    .topbar{ padding: 16px 32px; }

    /* tab bar joins the app pane instead of floating over the viewport */
    .tabbar{
      position: sticky;
      left: auto; right: auto; margin: 0;
      max-width: none;
      border-inline: 0;
    }
    .toast{ bottom: 88px; }

    .hero h1{ font-size: 2.2rem; }
    .btn{ padding: 14px 16px; }

    /* home/lobby/credits are just a form or a page of text — a
       comfortable centered column, not stretched edge to edge of the
       wider shell (which stays the same width as every other screen) */
    #app[data-screen="home"] .screen > *,
    #app[data-screen="lobby"] .screen > *,
    #app[data-screen="credits"] .screen > *{
      max-width: 520px; margin-left: auto; margin-right: auto;
    }

    /* dice entry: two columns as soon as there's room, so all 7 colors
       don't have to be scrolled through one at a time */
    #app[data-screen="entry"] .entry-grid{
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      border: 0; overflow: visible; background: transparent;
    }
    #app[data-screen="entry"] .entry-grid .entry-r{
      border: 1px solid var(--panel-line); border-radius: 12px;
    }
    #app[data-screen="entry"] .entry-grid .entry-r:only-child{ grid-column: 1 / -1; }
    /* left-aligned (not centered) to the same edge as the grid and the
       heading above — centering them independently left a jagged edge
       where the narrower total/save/back block didn't line up with the
       full-width grid and title */
    #app[data-screen="entry"] .total-banner,
    #app[data-screen="entry"] .entry-hint,
    #app[data-screen="entry"] .photo-section,
    #app[data-screen="entry"] .screen > .btn{

    #app[data-screen="board"] table.board{ font-size: 0.92rem; }

    #app[data-screen="board"] table.board td{ padding: 12px 9px; }
    #app[data-screen="board"] table.board td.name-cell,
    #app[data-screen="board"] table.board th.name-cell{ max-width: none; }
  }

  /* desktop: the shell stops scaling with the viewport — one fixed
     width shared by every screen, same rationale as the tablet block */
  @media (min-width: 1040px){
    .screen{ padding: 34px 40px 26px; }
    .topbar{ padding: 18px 40px; }
    #app{ max-width: 960px; }

    .hero h1{ font-size: 2.4rem; }
  }

function detectLang(){
  try {
    const saved = localStorage.getItem('pr.lang');
    if(saved && I18N[saved]) return saved;
  } catch {}
  const prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for(const p of prefs){
    const base = String(p || '').toLowerCase().split('-')[0];
    if(I18N[base]) return base;
  }
  return 'en';
}
function t(key, vars){
  const dict = I18N[state.lang] || I18N.en;
  let s = (dict[key] != null ? dict[key] : (I18N.en[key] != null ? I18N.en[key] : key));
  if(vars) for(const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
  return s;
}
function setLang(l){
  if(!I18N[l]) return;
  try { localStorage.setItem('pr.lang', l); } catch {}
  document.documentElement.lang = l;
  applyMeta(l);
  setState({ lang: l });
}
// Translate the document <title> and description for human visitors. The static
// tags in the HTML stay English so non-JS crawlers and link scrapers see them.
function applyMeta(l){
  const dict = I18N[l] || I18N.en;
  if(dict['meta.title']) document.title = dict['meta.title'];
  const d = document.querySelector('meta[name="description"]');
  if(d && dict['meta.desc']) d.setAttribute('content', dict['meta.desc']);
}

const FIELD_KEYS = ['yellow','purple','blue','blueGlitter','redWhite','redBlack','green','clear','pink'];
const emptyFields = () => Object.fromEntries(FIELD_KEYS.map(k => [k, '']));

const AVATAR_COLORS = ['var(--c-yellow)','var(--c-purple)','var(--c-blue)','var(--c-red)','var(--c-green)','var(--c-pink)','var(--c-clear)'];
function avatarColorIndex(id){ let h=0; for(const ch of String(id)) h += ch.charCodeAt(0); return h % AVATAR_COLORS.length; }
function avatarColor(id){ return AVATAR_COLORS[avatarColorIndex(id)]; }
// Local-mode players can tap their avatar to pick a clan color explicitly
// (p.colorIndex); everyone else (online players, or before a tap) falls
// back to the deterministic hash so avatars are still consistent by default.
function playerColor(p){ return AVATAR_COLORS[(p.colorIndex ?? avatarColorIndex(p.id)) % AVATAR_COLORS.length]; }
function genId(){ return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3); }
// Pity (pink) dice available for the box, by player count — 2-3:1, 4-6:2, 7-9:3, 10+:4.
function pinkDiceFor(n){
  if(n <= 1) return 0;
  if(n <= 3) return 1;
  if(n <= 6) return 2;
  if(n <= 9) return 3;
  return 4;
}

/* ------------------------------------------------------------------ *
 * fields <-> dice
 * ------------------------------------------------------------------ */
function parseValues(s){
  return String(s || '').split(/[^0-9.]+/).map(x => x.trim()).filter(Boolean)
    .map(Number).filter(n => Number.isFinite(n)).map(n => Math.max(0, Math.min(99, Math.round(n))));
}
function fieldsToDice(f){
  const dice = [];
  parseValues(f.yellow).forEach(v => dice.push({ color:'yellow', value:v }));
  parseValues(f.purple).forEach(v => dice.push({ color:'purple', value:v }));
  parseValues(f.blue).forEach(v => dice.push({ color:'blue', value:v, glitter:false }));
  parseValues(f.blueGlitter).forEach(v => dice.push({ color:'blue', value:v, glitter:true }));
  parseValues(f.redWhite).forEach(v => dice.push({ color:'red', value:v, sign:'positive' }));
  parseValues(f.redBlack).forEach(v => dice.push({ color:'red', value:v, sign:'negative' }));
  parseValues(f.green).forEach(v => dice.push({ color:'green', value:v }));
  parseValues(f.clear).forEach(v => dice.push({ color:'clear', value:v }));
  parseValues(f.pink).forEach(v => dice.push({ color:'pink', value:v }));
  return dice;
}
function diceToFields(dice){
  const f = emptyFields();
  const add = (k, v) => { f[k] = (f[k] ? f[k] + ' ' : '') + v; };
  (dice || []).forEach(d => {
    if(!DICE_COLORS.includes(d.color)) return;
    if(d.color === 'blue') add(d.glitter ? 'blueGlitter' : 'blue', d.value);
    else if(d.color === 'red') add(d.sign === 'negative' ? 'redBlack' : 'redWhite', d.value);
    else add(d.color, d.value);
  });
  return f;
}
// Round 1: every player rolls only their single starting yellow die.
function diceForRound(fields, round){
  const dice = fieldsToDice(fields);
  if(round === 1){
    const y = dice.find(d => d.color === 'yellow');
    return y ? [{ color:'yellow', value:y.value }] : [];
  }
  return dice;
}

const LS = {
  get(k, fb){ try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch { return fb; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} },
};
const roundKey = code => `pr.round.${code}`;

let aiAvailable = true;

async function api(op, payload){
  if(op === 'get'){
    const r = await fetch(`/api/game?code=${encodeURIComponent(payload.code)}`, { cache:'no-store' });
    if(!r.ok) throw Object.assign(new Error('get failed'), { status:r.status, body: await r.json().catch(()=>({})) });
    return r.json();
  }
  const r = await fetch('/api/game', {
    method:'POST', headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ op, proCode: state.pro?.code, ...payload }),
  });
  const body = await r.json().catch(() => ({}));
  if(!r.ok) throw Object.assign(new Error(body.error || 'request failed'), { status:r.status, body });
  return body;
}

async function analyzePhoto(dataUrl){
  const r = await fetch('/api/analyze', {
    method:'POST', headers:{ 'content-type':'application/json' },
    body: JSON.stringify({ image: dataUrl, proCode: state.pro?.code }),
  });
  const body = await r.json().catch(() => ({}));
  if(r.status === 503){ aiAvailable = false; throw Object.assign(new Error('ai off'), { soft:true }); }
  if(r.status === 402) throw Object.assign(new Error('payment_required'), { status:402 });
  if(!r.ok) throw new Error(body.message || 'Could not read the photo');
  return body.dice || [];
}

function resizeImageFile(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1100;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function setState(patch){ state = { ...state, ...patch }; render(); }
function toast(msg, ms){
  setState({ toast: msg });
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { if(state.toast === msg) setState({ toast:null }); }, ms || 2400);
}
function saveMe(name){
  state.me = { id: state.me.id, name: (name ?? state.me.name).trim() };
  LS.set('pr.me', state.me);
}

/* ------------------------------------------------------------------ *
 * unified game view (works for both modes)
 * ------------------------------------------------------------------ */
function view(){
  if(state.mode === 'local'){
    const g = state.local || { players:[], scores:{} };
    return { code:'PASS & PLAY', players:g.players, scores:g.scores, hostId:null, isLocal:true };
  }
  const g = state.game;
  if(!g) return null;
  return { code:g.code, players:g.players || [], scores:g.scores || {}, hostId:g.hostId, isLocal:false };
}
function totalsFor(v){
  return v.players.map(p => {
    let total = 0;
    for(let r = 1; r <= ROUNDS; r++){
      const e = v.scores[r] && v.scores[r][p.id];
      if(e) total += e.total;
    }
    return { ...p, total };
  }).sort((a, b) => b.total - a.total);
}

 * actions

async function createOnline(name){
  saveMe(name);
  if(!state.me.name){ toast(t('t.enterName')); return; }
  try {
    const game = await api('create', { playerId: state.me.id, name: state.me.name });
    LS.set('pr.session', { mode:'online', code: game.code });
    LS.set(roundKey(game.code), 1);
    setState({ mode:'online', code: game.code, game, screen:'lobby', entryRound:1, banner:null });
  } catch(e){ handleApiError(e, { from:'home', reason:'online' }); }
}
async function joinOnline(name, code){
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  saveMe(name);
  if(!state.me.name){ toast(t('t.enterName')); return; }
  if(code.length < 3){ toast(t('t.enterCode')); return; }
  try {
    const game = await api('join', { code, playerId: state.me.id, name: state.me.name });
    LS.set('pr.session', { mode:'online', code: game.code });
    const savedRound = LS.get(roundKey(game.code), 1);
    setState({ mode:'online', code: game.code, game, screen:'lobby', entryRound: savedRound, banner:null });
  } catch(e){
    if(e.status === 404){ toast(t('t.noGame')); return; }
    handleApiError(e, { from:'home', reason:'online' });
  }
}
async function refreshOnline(){
  if(state.mode !== 'online' || !state.code) return;
  try {
    const game = await api('get', { code: state.code });
    if(JSON.stringify(game) !== JSON.stringify(state.game)) setState({ game });
  } catch(e){
    if(e.status === 404){ leaveGame(t('t.gameEnded'), 'info'); }
  }
}
function handleApiError(e, opts){
  if(e.status === 503){
    setState({ banner: t('banner.storage'), bannerKind: 'error' });
  } else if(e.status === 402){
    setState({ screen:'upgrade', upgradeFrom: (opts && opts.from) || state.screen, upgradeReason: (opts && opts.reason) || 'online' });
  } else {
    toast(t('t.wrong'));
  }
}

function startLocal(){
  const existing = LS.get('pr.local', null);
  const local = existing && existing.players && existing.players.length
    ? existing
    : { players: [], scores: {}, createdAt: Date.now() };
  LS.set('pr.local', local);
  LS.set('pr.session', { mode:'local' });
  setState({ mode:'local', local, screen:'lobby', entryRound:1, code:'PASS & PLAY', banner:null });
}
function persistLocal(){ if(state.local) LS.set('pr.local', state.local); }
function addLocalPlayer(name){
  name = (name || '').trim().slice(0, 24);
  if(!name) return;
  const local = { ...state.local, players: [...state.local.players, { id: genId(), name }] };
  setState({ local }); persistLocal();
}
function removeLocalPlayer(id){
  const players = state.local.players.filter(p => p.id !== id);
  const scores = {};
  for(const r of Object.keys(state.local.scores)){
    scores[r] = { ...state.local.scores[r] }; delete scores[r][id];
  }
  setState({ local: { ...state.local, players, scores } }); persistLocal();
}
function cycleLocalPlayerColor(id){
  const players = state.local.players.map(p => p.id === id
    ? { ...p, colorIndex: ((p.colorIndex ?? avatarColorIndex(p.id)) + 1) % AVATAR_COLORS.length }
    : p);
  setState({ local: { ...state.local, players } }); persistLocal();
}
function reorderLocalPlayer(id, toIndex){
  const players = [...state.local.players];
  const from = players.findIndex(p => p.id === id);
  if(from === -1 || from === toIndex) return;
  const [p] = players.splice(from, 1);
  players.splice(Math.max(0, Math.min(toIndex, players.length)), 0, p);
  setState({ local: { ...state.local, players } }); persistLocal();
}
// "Play again": clears every round's scores but keeps the roster (names,
// ids, colors) exactly as they were — per the pass-and-play rematch flow.
function resetLocalMatch(){
  setState({ local: { ...state.local, scores: {} }, entryRound: 1, screen:'lobby' });
  persistLocal();
}

function leaveGame(msg, kind){
  stopPoll();
  if(state.mode === 'online' && state.code){
    api('leave', { code: state.code, playerId: state.me.id }).catch(() => {});
  }
  LS.del('pr.session');
  setState({
    screen:'home', mode:null, code:null, game:null, local:null,
    fields: emptyFields(), photo:null, analyzeError:null,
    banner: msg || null, bannerKind: kind || 'info',
  });
}

async function openEntry(playerId, round){
  const v = view();
  const existing = v.scores[round] && v.scores[round][playerId];
  setState({
    screen:'entry',
    entryPlayerId: playerId,
    entryRound: round,
    fields: existing ? diceToFields(existing.dice) : emptyFields(),
    photo: null, analyzeError: null, photoCount: 0,
  });
}

async function saveEntry(){
  const round = state.entryRound;
  const dice = diceForRound(state.fields, round);
  if(state.mode === 'local'){
    const scored = scoreRound(dice);
    const scores = { ...state.local.scores };
    scores[round] = { ...(scores[round] || {}) };
    scores[round][state.entryPlayerId] = { total: scored.total, breakdown: scored.breakdown, dice, submittedAt: Date.now() };
    const local = { ...state.local, scores };
    setState({ local, screen:'lobby' });
    persistLocal();
    const nextUnscored = local.players.find(p => !(scores[round] && scores[round][p.id]));
    if(nextUnscored){
      toast(t('t.savedNext', { name: nextUnscored.name }));
    } else {
      // Every player has entered this round — announce the leader. A
      // completed final round gets the bigger "game over" toast instead.
      const totals = totalsFor({ players: local.players, scores: local.scores });
      const top = totals[0];
      if(round === ROUNDS){
        toast(t('board.winner', { name: top.name, n: top.total }), 5000);
      } else {
        toast(t('t.roundLeader', { name: top.name, n: top.total, r: round }), 5000);
      }
    }
    return;
  }
  try {
    const game = await api('score', { code: state.code, playerId: state.me.id, round, dice });
    const next = Math.min(ROUNDS, round + 1);
    LS.set(roundKey(state.code), next);
    setState({ game, screen:'lobby', entryRound: next, fields: emptyFields(), photo:null });
    toast(t('t.roundSaved', { n: round }));
  } catch(e){ handleApiError(e); }
}

function syncPolling(){
  const want = state.mode === 'online' && (state.screen === 'lobby' || state.screen === 'board');
  if(want && !pollTimer){
    pollTimer = setInterval(refreshOnline, 3000);
    refreshOnline();
  } else if(!want && pollTimer){
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function renderLobby(){
  const v = view();
  const me = state.me.id;
  const round = state.entryRound;

  // Local mode: the LIST ORDER reflects last round's results (so the phone
  // naturally passes to whoever's turn feels "next" by recent momentum), but
  // each name still carries its overall #rank (aggregate total across all
  // rounds so far) and a pity-die ribbon for whoever's currently lowest
  // overall — e.g. the round-3 winner can sit at the top of the list while
  // still showing "#2" if someone else leads the aggregate score.
  const totals = v.isLocal ? totalsFor(v) : null; // sorted desc by aggregate total
  const showRankings = !!(totals && totals.some(p => p.total > 0));
  const pinkCount = v.isLocal ? pinkDiceFor(v.players.length) : 0;
  const bottomIds = showRankings ? new Set(totals.slice(Math.max(0, totals.length - pinkCount)).map(p => p.id)) : new Set();

  // Overall rank number per player, competition-style (ties share a rank;
  // the next distinct total skips accordingly).
  const rankOf = new Map();
  if(showRankings){
    let rank = 0, seen = 0, prevTotal = null;
    for(const p of totals){
      seen++;
      if(p.total !== prevTotal){ rank = seen; prevTotal = p.total; }
      rankOf.set(p.id, rank);
    }
  }

  const prevRound = round - 1;
  const orderedPlayers = v.isLocal && prevRound >= 1
    ? [...v.players].sort((a, b) => {
        const sa = (v.scores[prevRound] && v.scores[prevRound][a.id]) ? v.scores[prevRound][a.id].total : 0;
        const sb = (v.scores[prevRound] && v.scores[prevRound][b.id]) ? v.scores[prevRound][b.id].total : 0;
        return sb - sa;
      })
    : (showRankings ? totals : v.players);
  const started = v.isLocal && Object.keys(v.scores).length > 0;

  const playerList = orderedPlayers.length ? orderedPlayers.map(p => {
    const done = v.scores[round] && v.scores[round][p.id];
    const isMe = !v.isLocal && p.id === me;
    const rankTag = v.isLocal && rankOf.has(p.id) ? ` <span class="rank-tag" title="Overall rank">#${rankOf.get(p.id)}</span>` : '';
    const pityTag = v.isLocal && bottomIds.has(p.id) ? ' <span class="rank-tag" title="Pity die">🎀</span>' : '';
    return `
      <div class="player-row" data-pid="${p.id}">

function breakdownRows(dice, scored){
  const b = scored.breakdown, c = scored.counts;
  return [
    c.yellow ? [t('color.yellow'), b.yellowSum] : null,
    c.purple ? [t('bd.purple'), b.purpleSum] : null,
    c.blue ? [dice.some(d => d.color === 'blue' && d.glitter) ? t('bd.blueGlitter') : t('color.blue'), b.blueScore] : null,
    c.red ? [t('bd.red', { n: c.red }), b.redScore] : null,
    c.green ? [t('color.green'), b.greenSum] : null,
    c.clear ? [t('color.clear'), b.clearSum] : null,
    c.pink ? [t('color.pink'), b.pinkSum] : null,
  ].filter(Boolean);
}

  const totals = totalsFor(v);

  const now = state.entryRound;
  const localFinished = v.isLocal && v.players.every(p => v.scores[ROUNDS] && v.scores[ROUNDS][p.id]);
  const gameOver = (localFinished || (!v.isLocal && state.game && state.game.finished)) && totals.length && top > 0;

  return `

function bind(){
  const app = document.getElementById('app');

  app.onclick = async (e) => {
    const el = e.target.closest('[data-a]');
    if(!el) return;
    const a = el.dataset.a;
    const id = el.dataset.id;

    if(a === 'lang'){ return; }
    if(a === 'home-tab') setState({ homeTab: el.dataset.v });
    else if(a === 'create-online') createOnline(document.getElementById('nameInput').value);
    else if(a === 'join-online') joinOnline(document.getElementById('nameInput').value, document.getElementById('codeInput').value);
    else if(a === 'start-local') startLocal();
    else if(a === 'new-local'){ LS.del('pr.local'); startLocal(); }
    else if(a === 'leave') leaveGame();
    else if(a === 'tab-play') setState({ screen:'lobby' });
    else if(a === 'tab-board') setState({ screen:'board' });
    else if(a === 'tab-credits') setState({ screen:'credits' });
    else if(a === 'credits-back') setState({ screen: state.mode ? 'lobby' : 'home' });
    else if(a === 'go-credits') setState({ screen:'credits' });
    else if(a === 'upgrade-back') setState({ screen: state.upgradeFrom || 'home' });
    else if(a === 'checkout'){
      const email = (document.getElementById('upgradeEmail')?.value || '').trim();
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op: 'checkout', email: email || undefined }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.status === 503){ toast(t('upgrade.billingOff')); return; }
        if(!r.ok || !data.url){ toast(t('t.wrong')); return; }
        location.href = data.url;
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'redeem-code'){
      const inp = document.getElementById('redeemInput');
      const code = (inp?.value || '').trim().toUpperCase();
      if(!code) return;
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op: 'redeem', code }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.ok && data.ok){
          state.pro = { code, email: data.email || null };
          LS.set('pr.pro', state.pro);
          toast(t('upgrade.redeemOk'));
          // Stay put (rather than auto-navigating away) so the "save an
          // account" offer below is actually reachable right after redeeming.
          render();
        } else if(data.error === 'retired'){
          toast(t('upgrade.redeemRetired'));
          setState({ showLoginForm: true });
        } else {
          toast(t('upgrade.redeemBad'));
        }
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'show-register') setState({ showRegisterForm: true });
    else if(a === 'show-login') setState({ showLoginForm: true });
    else if(a === 'register-account'){
      const email = (document.getElementById('registerEmail')?.value || '').trim();
      const password = document.getElementById('registerPassword')?.value || '';
      if(password.length < 8){ toast(t('auth.passwordShort')); return; }
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op:'register', email, code: state.pro?.code, password }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.ok && data.ok){
          state.pro = { code: data.code, email: data.email };
          LS.set('pr.pro', state.pro);
          setState({ loggedIn: true, showRegisterForm: false });
          toast(t('auth.accountCreated'));
        } else if(data.error === 'email_taken'){ toast(t('auth.emailTaken')); }
        else if(data.error === 'invalid_code'){ toast(t('auth.invalidCode')); }
        else { toast(t('t.wrong')); }
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'login-account'){
      const email = (document.getElementById('loginEmail')?.value || '').trim();
      const password = document.getElementById('loginPassword')?.value || '';
      try {
        const r = await fetch('/api/billing', {
          method:'POST', headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ op:'login', email, password }),
        });
        const data = await r.json().catch(() => ({}));
        if(r.ok && data.ok){
          state.pro = { code: data.code, email: data.email };
          LS.set('pr.pro', state.pro);
          setState({ loggedIn: true, showLoginForm: false });
          toast(t('auth.loggedIn'));
        } else {
          toast(t('auth.invalidCredentials'));
        }
      } catch { toast(t('t.wrong')); }
    }
    else if(a === 'logout-account'){
      try { await fetch('/api/billing', { method:'POST', headers:{ 'content-type':'application/json' }, body: JSON.stringify({ op:'logout' }) }); }
      catch {}
      setState({ loggedIn: false });
      toast(t('auth.loggedOut'));
    }
    else if(a === 'refresh'){ await refreshOnline(); toast(t('t.updated')); }
    else if(a === 'round-prev') setState({ entryRound: Math.max(1, state.entryRound - 1) });
    else if(a === 'round-next') setState({ entryRound: Math.min(ROUNDS, state.entryRound + 1) });
    else if(a === 'add-player'){
      const inp = document.getElementById('addPlayer');
      addLocalPlayer(inp.value); inp.value = '';
    }
    else if(a === 'rm-player') removeLocalPlayer(id);
    else if(a === 'cycle-color') cycleLocalPlayerColor(id);
    else if(a === 'new-match') resetLocalMatch();
    else if(a === 'score-player') openEntry(id, state.entryRound);
    else if(a === 'score-self') openEntry(state.me.id, state.entryRound);
    else if(a === 'save-entry') saveEntry();
    else if(a === 'copy-link'){
      const link = `${location.origin}/?code=${view().code}`;
      try { await navigator.clipboard.writeText(link); toast(t('t.linkCopied')); }
      catch { toast(link); }
    }
    else if(a === 'reset-scores'){
      if(!confirm(t('confirm.wipe'))) return;
      try { const game = await api('reset', { code: state.code, playerId: state.me.id }); setState({ game }); toast(t('t.scoresCleared')); }
      catch(err){ handleApiError(err); }
    }
  };

  app.onchange = (e) => {
    const sel = e.target.closest('select[data-a="lang"]');
    if(sel) setLang(sel.value);
  };

  // live recalculation on every keystroke + tidy on blur
  app.oninput = (e) => {
    const inp = e.target.closest('[data-field]');
    if(!inp) return;
    state.fields = { ...state.fields, [inp.dataset.field]: inp.value };
    updateEntryTotals();
  };
  app.onfocusout = (e) => {
    const inp = e.target.closest('[data-field]');
    if(!inp) return;
    const tidy = parseValues(inp.value).join(' ');
    if(tidy !== inp.value){ inp.value = tidy; state.fields[inp.dataset.field] = tidy; }
    updateEntryTotals();
  };
  app.onfocusin = (e) => {
    const inp = e.target.closest('[data-field]');
    if(inp) inp.select();
  };

  // Enter tabs to the next dice-entry field, or to Save once past the last one.
  app.onkeydown = (e) => {
    if(e.key !== 'Enter') return;
    const inp = e.target.closest('[data-field]');
    if(!inp) return;
    e.preventDefault();
    const fields = [...document.querySelectorAll('.entry-grid [data-field]')];
    const i = fields.indexOf(inp);
    const next = fields[i + 1];
    if(next) next.focus();
    else document.querySelector('[data-a="save-entry"]')?.focus();
  };

  // Local-mode player reordering: pointer-based drag (native HTML5 drag
  // doesn't work reliably on mobile touch, and this app lives on a phone
  // at the table). Drag the handle; drop position is resolved once, at
  // release, against each row's pre-drag position — simpler and more
  // reliable than live-reflowing every sibling mid-drag.
  app.onpointerdown = (e) => {
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const row = handle.closest('.player-row');
    const rows = [...row.parentElement.querySelectorAll('.player-row')];
    dragState = {
      id: handle.dataset.id,
      row,
      pointerId: e.pointerId,
      startY: e.clientY,
      rowHeight: row.getBoundingClientRect().height,
      rects: rows.map(r => r.getBoundingClientRect()),
    };
    row.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  };
  app.onpointermove = (e) => {
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    dragState.row.style.transform = `translateY(${e.clientY - dragState.startY}px)`;
  };
  const endDrag = (e) => {
    if(!dragState || e.pointerId !== dragState.pointerId) return;
    const dy = e.clientY - dragState.startY;
    dragState.row.style.transform = '';
    dragState.row.classList.remove('dragging');
    const draggedIndex = [...dragState.row.parentElement.querySelectorAll('.player-row')].indexOf(dragState.row);
    const draggedCenterY = dragState.rects[draggedIndex].top + dragState.rowHeight / 2 + dy;
    let toIndex = dragState.rects.length - 1;
    for(let i = 0; i < dragState.rects.length; i++){
      if(draggedCenterY < dragState.rects[i].top + dragState.rowHeight / 2){ toIndex = i; break; }
    }
    reorderLocalPlayer(dragState.id, toIndex);
    dragState = null;
  };
  app.onpointerup = endDrag;
  app.onpointercancel = endDrag;

  const photo = document.getElementById('photoInput');
  if(photo){
    photo.onchange = async () => {
      const file = photo.files[0];
      if(!file) return;
      let dataUrl;
      try { dataUrl = await resizeImageFile(file); }
      catch { toast(t('t.badImage')); return; }
      setState({ photo: dataUrl, analyzing: true, analyzeError: null });
      try {
        const dice = await analyzePhoto(dataUrl);
        if(!dice.length){
          setState({ analyzing: false, analyzeError: t('t.noDice') });
          return;
        }
        const merged = mergeFields(state.fields, diceToFields(dice));
        const count = FIELD_KEYS.reduce((s, k) => s + (merged[k] ? String(merged[k]).trim().split(/\s+/).length : 0), 0);
        setState({ analyzing: false, fields: merged, analyzeError: null, photoCount: count });
      } catch(err){
        if(err.soft) setState({ analyzing: false, photo: null });
        else if(err.status === 402) setState({ analyzing:false, photo:null, screen:'upgrade', upgradeFrom:'entry', upgradeReason:'ai' });
        else setState({ analyzing: false, analyzeError: t('t.photoErr') });
      }
    };
  }

  const codeInput = document.getElementById('codeInput');
  if(codeInput) codeInput.oninput = () => { state._prefillCode = codeInput.value; };
}

// only overwrite fields the photo actually found something for
function mergeFields(cur, found){
  const out = { ...cur };
  for(const k of FIELD_KEYS) if(found[k]) out[k] = found[k];
  return out;
}

function updateEntryTotals(){
  const dice = diceForRound(state.fields, state.entryRound);
  const scored = scoreRound(dice);
  const n = document.querySelector('.total-banner .n');
  if(n) n.textContent = scored.total;
  const rows = breakdownRows(dice, scored);
  const wrap = document.querySelector('.total-banner .breakdown');
  const html = rows.map(([l, val]) => `<div class="row"><span>${esc(l)}</span><span>${val}</span></div>`).join('');
  if(wrap) wrap.innerHTML = html;
  else if(rows.length){
    const banner = document.querySelector('.total-banner');
    if(banner) banner.insertAdjacentHTML('beforeend', `<div class="breakdown">${html}</div>`);
  }
}

/* ------------------------------------------------------------------ *
 * boot
 * ------------------------------------------------------------------ */
// After a successful Stripe redirect (?session_id=...): the webhook that mints
// the Pro code can lag a beat behind the redirect, so poll briefly before
// falling back to "check your email".
async function handleCheckoutReturn(sessionId){
  for(let i = 0; i < 6; i++){
    try {
      const r = await fetch(`/api/billing?op=session&session_id=${encodeURIComponent(sessionId)}`);
      if(r.ok){
        const d = await r.json();
        if(d && d.code){
          state.pro = { code: d.code, email: d.email || null };
          LS.set('pr.pro', state.pro);
          history.replaceState({}, '', location.pathname);
          toast(t('upgrade.unlocked'));
          // Land on the upgrade screen so the "save an account" offer is
          // visible right after a purchase, not just after a manual redeem.
          state.screen = 'upgrade';
          state.upgradeFrom = 'home';
          render();
          return;
        }
      }
    } catch {}
    await new Promise(r => setTimeout(r, 1500));
  }
  history.replaceState({}, '', location.pathname);
  toast(t('upgrade.checkEmail'));
}

async function boot(){
  // language: saved choice, else the browser's preferred, else English
  state.lang = detectLang();
  document.documentElement.lang = state.lang;
  if(state.lang !== 'en') applyMeta(state.lang);

  // probe AI availability quietly
  fetch('/api/analyze', { method:'GET' }).then(r => { if(r.status === 503) aiAvailable = false; }).catch(() => {});
  // hall of fame (empty until a game finishes)
  fetch('/api/hof').then(r => r.json()).then(d => {
    if(d && Array.isArray(d.entries) && d.entries.length){ state.hof = d.entries; if(state.screen === 'home') render(); }
  }).catch(() => {});
  // paywall feature flags — everything defaults to free until these say otherwise
  fetch('/api/flags').then(r => r.json()).then(d => {
    if(d && typeof d === 'object'){ state.flags = { ...state.flags, ...d }; render(); }
  }).catch(() => {});
  // returning Pro login: if this browser carries a session cookie, recover
  // the Pro code without the user re-entering anything (works even if
  // localStorage was cleared but cookies weren't)
  fetch('/api/billing?op=me').then(r => r.json()).then(d => {
    if(d && d.loggedIn && d.code){
      state.pro = { code: d.code, email: d.email || null };
      LS.set('pr.pro', state.pro);
      state.loggedIn = true;
      render();
    }
  }).catch(() => {});

  const params = new URLSearchParams(location.search);
  const deepCode = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const sessionId = params.get('session_id');
  if(sessionId) handleCheckoutReturn(sessionId);

  const session = LS.get('pr.session', null);
  if(deepCode){
    state.homeTab = 'online';
    state._prefillCode = deepCode;
    if(state.me.name){
      render();
      await joinOnline(state.me.name, deepCode);
      return;
    }
  } else if(session && session.mode === 'local'){
    const local = LS.get('pr.local', null);
    if(local && local.players){ state.mode = 'local'; state.local = local; state.code = 'PASS & PLAY'; state.screen = 'lobby'; }
  } else if(session && session.mode === 'online' && session.code){
    try {
      const game = await api('get', { code: session.code });
      state.mode = 'online'; state.code = session.code; state.game = game;
      state.entryRound = LS.get(roundKey(session.code), 1);
      state.screen = 'lobby';
    } catch { LS.del('pr.session'); }
  }
  render();
}
boot();
</script>
